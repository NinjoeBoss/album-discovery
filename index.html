    var W = window.innerWidth, dx = t.dx, list = tabs(), i = list.indexOf(view), j = i + (dx < 0 ? 1 : -1);
    if (dx === 0 || j < 0 || j >= list.length) { // first or last tab: stretch a little, nothing beside it
      dropPeek(); setX(app, dx / (1 + Math.abs(dx) / 120) * 0.6); inkAt(view, null, 0); t.target = null; return;
    }
    makePeek(list[j]); t.target = list[j];
    setX(app, dx);
    if (peek) setX(peek, dx + (dx < 0 ? W : -W));
    inkAt(view, list[j], Math.min(1, Math.abs(dx) / W));
  }
  function finish(cb, ms) { setTimeout(function () { cb(); busy = false; }, ms + 20); }
  app.addEventListener('touchstart', function (e) {
    t = null;
    if (busy || !D || e.touches.length !== 1 || nav.style.display === 'none') return;
    if (document.getElementById('scrim').classList.contains('on') || blocked(e.target)) return;
    var p = e.touches[0];
    t = { x0: p.clientX, y0: p.clientY, dx: 0, mode: '?', pts: [{ x: p.clientX, at: e.timeStamp }] };
  }, { passive: true });
  app.addEventListener('touchmove', function (e) {
    if (!t) return;
    var p = e.touches[0], dx = p.clientX - t.x0, dy = p.clientY - t.y0;
    if (e.touches.length !== 1) { cancel(); return; }
    if (t.mode === '?') {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      t.mode = Math.abs(dx) > Math.abs(dy) * 1.2 ? 'x' : 'y';
      if (t.mode === 'y') { t = null; return; }
      app.classList.add('dragging');
    }
    e.preventDefault(); // no up and down scrolling mid swipe
    t.dx = dx;
    t.pts.push({ x: p.clientX, at: e.timeStamp }); if (t.pts.length > 6) t.pts.shift();
    if (!calm() && !raf) raf = requestAnimationFrame(draw);
  }, { passive: false });
  function speed() { // px per ms over the last ~100ms, so a flick at the end counts even after a slow drag
    var pts = t.pts, last = pts[pts.length - 1], k = pts.length - 1;
    while (k > 0 && last.at - pts[k - 1].at < 100) k--;
    var dt = last.at - pts[k].at; return dt > 0 ? (last.x - pts[k].x) / dt : 0;
  }
  function cancel() {
    if (!t || t.mode !== 'x') { t = null; return; }
    var W = window.innerWidth, ms = 260, dir = t.dx < 0 ? 1 : -1;
    t = null; busy = true; if (raf) { cancelAnimationFrame(raf); raf = 0; }
    setX(app, 0, ms); if (peek) setX(peek, dir * W, ms);
    inkAt(view, null, 0, ms);
    finish(function () { dropPeek(); app.classList.remove('dragging'); setX(app, 0); app.style.transition = ''; ink.style.transition = ''; moveInk(); }, ms);
  }
  function end() {
    if (!t || t.mode !== 'x') { t = null; return; }
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    if (!calm()) draw();
    var W = window.innerWidth, dx = t.dx, v = speed(), target = t.target;
    if (calm()) { t = null; app.classList.remove('dragging'); if (Math.abs(dx) > 80) { var l = tabs(), j = l.indexOf(view) + (dx < 0 ? 1 : -1); if (j >= 0 && j < l.length) show(l[j]); } return; }
    var go = target && peek && (Math.abs(dx) > W * 0.33 || (Math.abs(v) > 0.3 && (v < 0) === (dx < 0)));
    if (!go) { cancel(); return; }
    t = null; busy = true;
    var left = W - Math.abs(dx), ms = Math.round(Math.max(170, Math.min(330, left / Math.max(Math.abs(v), 1.6))));
    var dir = dx < 0 ? 1 : -1;
    setX(app, -dir * W, ms); setX(peek, 0, ms);
    inkAt(view, target, 1, ms);
    finish(function () {
      // the peek already shows the new tab exactly where it will be, so swapping in the real one is invisible
      app.classList.remove('dragging'); setX(app, 0); app.style.transition = '';
      show(target, true);
      dropPeek();
      ink.style.transition = ''; inkReady = false; moveInk();
    }, ms);
  }
  app.addEventListener('touchend', end);
  app.addEventListener('touchcancel', cancel);
})();

/* ---------- talking to the sheet (Apps Script API) ---------- */

var API_URL = (window.AD_CONFIG && window.AD_CONFIG.apiUrl) || '';
function storeDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

/* POST with a plain text body: no preflight, which Apps Script can't answer. */
function api(action, args) {
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: action, args: args || [], session: storeGet('ad.session') || '' })
  }).then(function (r) {
    if (!r.ok) throw new Error('The sheet didn\'t answer (' + r.status + '). Try again in a moment.');
    return r.json();
  }, function () {
    throw new Error(navigator.onLine === false ? 'You\'re offline. Showing what was saved on this phone.' : 'Couldn\'t reach the sheet. Check your connection and try again.');
  }).then(function (j) {
    if (j.ok) return j.result;
    if (j.error === 'SIGNED_OUT') { signedOut(); throw new Error('Please sign in again.'); }
    throw new Error(j.error || 'Something went wrong.');
  });
}

/* Same calling style the page used with Apps Script (google.script.run.withSuccessHandler(...).fn(...)). */
function runner(ok, fail) {
  var r = {
    withSuccessHandler: function (f) { return runner(f, fail); },
    withFailureHandler: function (f) { return runner(ok, f); }
  };
  ['getData', 'submitRating', 'searchAlbums', 'submitPick', 'removePick'].forEach(function (name) {
    r[name] = function () {
      api(name, Array.prototype.slice.call(arguments)).then(ok || function () {}, fail || function (e) { toast(e.message); });
    };
  });
  return r;
}
var google = { script: { run: runner() } };

/* ---------- sign in ---------- */

var signState = { members: null, name: null, hint: '', busy: false, err: '' };

function chrome(on) {
  document.getElementById('nav').style.display = on ? '' : 'none';
  document.getElementById('season').style.display = on ? '' : 'none';
  if (!on) document.getElementById('avatar').style.display = 'none';
}

function renderSignIn() {
  chrome(false);
  var h = '<div class="card signin"><img class="logo" src="icons/icon-192.png" alt=""><div class="eyebrow">Club Music</div>';
  if (!signState.members) {
    h += '<h2>Who are you?</h2><div class="muted">' + (signState.err ? '' : 'Loading the club…') + '</div>' +
      (signState.err ? '<div class="actions" style="justify-content:center"><button class="btn primary" onclick="loadMembers()">Try again</button></div>' : '');
  } else if (!signState.name) {
    h += '<h2>Who are you?</h2><div class="muted">Tap your name and we\'ll email you a code. You only do this once on each phone.</div><div class="who">' +
      signState.members.map(function (n) {
        return '<button style="background:' + color(n) + '" onclick="sendCode(\'' + jsq(n) + '\')"' + (signState.busy ? ' disabled' : '') + '>' + face(n, 'mini') + esc(n) +
          (signState.busy === n ? '<span class="t2" style="margin-left:auto">Sending…</span>' : '') + '</button>';
      }).join('') + '</div>';
  } else {
    h += '<h2>Check your email</h2><div class="muted">We sent a 6 digit code to <b>' + esc(signState.hint) + '</b>. It works for 10 minutes.</div>' +
      '<input id="code" class="codebox" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="······" value="' + esc(signState.code || '') + '"' + (signState.busy ? ' disabled' : '') + ' oninput="if(this.value.replace(/\\D/g,\'\').length===6)checkCode()">' +
      '<button class="btn primary big" id="codeBtn" onclick="checkCode()"' + (signState.busy ? ' disabled' : '') + '>' + (signState.busy ? 'Checking…' : 'Sign in') + '</button>' +
      '<div class="row2"><button class="linkish" onclick="sendCode(signState.name)">Send a new code</button>' +
      '<button class="linkish" onclick="signState.name=null;signState.err=\'\';renderSignIn()">Not ' + esc(signState.name) + '?</button></div>';
  }
  if (signState.err) h += '<div class="msg err">' + esc(signState.err) + '</div>';
  document.getElementById('app').innerHTML = h + '</div>';
  var c = document.getElementById('code'); if (c && !signState.busy) c.focus();
}

function loadMembers() {
  signState.err = ''; renderSignIn();
  api('members').then(function (list) { signState.members = list; renderSignIn(); },
    function (e) { signState.err = e.message; renderSignIn(); });
}
function sendCode(name) {
  signState.busy = name; signState.err = ''; renderSignIn();
  api('requestCode', [name]).then(function (r) {
    signState.busy = false; signState.name = name; signState.hint = r.hint; renderSignIn();
  }, function (e) { signState.busy = false; signState.err = e.message; renderSignIn(); });
}
function checkCode() {
  var el = document.getElementById('code');
  var code = (el ? el.value : '').replace(/\D/g, '');
  if (signState.busy) return;
  signState.code = code;
  if (code.length !== 6) { signState.err = 'The code is 6 digits.'; renderSignIn(); return; }
  signState.busy = true; signState.err = ''; renderSignIn();
  api('verifyCode', [signState.name, code]).then(function (r) {
    storeSet('ad.session', r.session);
    signState = { members: null, name: null, hint: '', busy: false, err: '' };
    start();
  }, function (e) { signState.busy = false; signState.code = ''; signState.err = e.message; renderSignIn(); });
}
function signedOut() {
  storeDel('ad.session'); storeDel('ad.data'); storeDel('ad.platform'); storeDel('ad.platformSync');
  D = null; closeAlbum(); syncBack();
  signState = { members: null, name: null, hint: '', busy: false, err: '' };
  loadMembers();
}
function signOut() {
  api('signOut').then(signedOut, signedOut);
}

/* ---------- install tip ---------- */

var deferredInstall = null;
window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferredInstall = e; if (D && view === 'home') show('home'); });
function standalone() { return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true; }
function installCard() {
  if (standalone() || storeGet('ad.installHidden')) return '';
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (!ios && !deferredInstall) return '';
  return '<div class="card install"><img src="icons/icon-192.png" alt=""><div><div class="t1">Put Club Music on your home screen</div>' +
    '<div class="t2">' + (ios ? 'In Safari, tap the Share button, then <b>Add to Home Screen</b>.' : 'Opens full screen like any other app.') + '</div>' +
    (ios ? '' : '<button class="btn gold" style="margin-top:8px" onclick="installApp()">Install</button>') +
    '</div><button class="x" onclick="hideInstall()" aria-label="Hide">×</button></div>';
}
function installApp() { if (!deferredInstall) return; deferredInstall.prompt(); deferredInstall.userChoice.then(function () { deferredInstall = null; show(view); }); }
function hideInstall() { storeSet('ad.installHidden', '1'); show(view); }

/* ---------- start up ---------- */

function localToday() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function safeToRedraw() { return !document.getElementById('scrim').classList.contains('on') && ['home', 'albums', 'members', 'stats'].indexOf(view) >= 0; }

/* Fresh numbers from the sheet. Redraws only pages where nobody is typing. */
function refresh(first) {
  var badge = document.getElementById('syncing');
  badge.classList.add('on');
  api('getData').then(function (data) {
    if (savesPending) return; // a rating is still saving; its answer brings fresher numbers
    badge.classList.remove('on');
    prep(data);
    if (first || safeToRedraw()) show(view);
  }, function (e) {
    badge.classList.remove('on');
    if (!storeGet('ad.session')) return; // signed out: sign in screen is up
    if (!D) document.getElementById('app').innerHTML = '<div class="card">' + esc(e.message) + '<div class="actions"><button class="btn primary" onclick="refresh(true)">Try again</button></div></div>';
    else toast(e.message);
  });
}

function loadAvatars() {
  try { AVATARS = JSON.parse(storeGet('ad.avatars') || '{}'); } catch (e) { AVATARS = {}; }
  api('avatars').then(function (map) {
    var text = JSON.stringify(map || {});
    if (text === storeGet('ad.avatars')) return;
    storeSet('ad.avatars', text); AVATARS = map || {};
    if (D) { prep(D); if (safeToRedraw()) show(view); }
  }, function () {});
}

function start() {
  if (!API_URL) {
    document.getElementById('app').innerHTML = '<div class="card signin"><img class="logo" src="icons/icon-192.png" alt=""><h2>Almost ready</h2><div class="muted">This app isn\'t connected to the sheet yet. Add the Apps Script web app URL to config.js.</div></div>';
    chrome(false);
    return;
  }
  if (!storeGet('ad.session')) { loadMembers(); return; }
  chrome(true);
  loadAvatars();
  var cached = null;
  try { cached = JSON.parse(storeGet('ad.data') || 'null'); } catch (e) {}
  if (cached) { cached.today = localToday(); prep(cached); show('home'); }
  refresh(!cached);
}

/* Coming back to the app after a while: pull fresh numbers. */
var lastHidden = 0;
document.addEventListener('visibilitychange', function () {
  if (document.hidden) { lastHidden = Date.now(); return; }
  if (D && storeGet('ad.session') && Date.now() - lastHidden > 60000) refresh(false);
});

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      // Look for a new version whenever the app comes back to the front (installed apps rarely reload).
      document.addEventListener('visibilitychange', function () { if (!document.hidden) reg.update().catch(function () {}); });
    }).catch(function () {});
  });
}

start();
</script>

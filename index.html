<script>
/* Moving to clubmusic.net: the app's saved sign in, platform and theme belong to one web address,
   so the old address (club-music.net) hands them over in the link when it sends you to the new one.
   The old copy only moves you once clubmusic.net is really serving the app (its icon loads),
   so nothing breaks before the switch. The hand over is in the # part of the link, which never
   leaves the phone, and it's wiped from the address bar straight away. */
(function () {
  var MAIN = 'clubmusic.net', OLD = ['club-music.net', 'www.club-music.net'];
  var KEYS = ['ad.session', 'ad.platform', 'ad.platformSync', 'ad.theme', 'ad.season', 'ad.installHidden'];
  var host = location.hostname;
  try {
    if (host === MAIN || host === 'www.' + MAIN) {
      var m = /[#&]handoff=([^&]+)/.exec(location.hash);
      if (!m) return;
      var got = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1])))));
      // Anything this address already has wins (someone who already signed in here stays as they are).
      KEYS.forEach(function (k) { if (got[k] != null && localStorage.getItem(k) == null) localStorage.setItem(k, got[k]); });
      history.replaceState(null, '', location.pathname + location.search);
      return;
    }
    if (OLD.indexOf(host) < 0) return;
    var probe = new Image();
    probe.onload = function () {
      var out = {};
      KEYS.forEach(function (k) { var v = localStorage.getItem(k); if (v != null) out[k] = v; });
      location.replace('https://' + MAIN + '/#handoff=' + encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(out))))));
    };
    probe.src = 'https://' + MAIN + '/icons/icon-192.png?v=' + Date.now();
  } catch (e) {}
})();
</script>
<script>
/* Staying signed in when you add the app to your iPhone home screen.
   iPhone gives a home screen app its own storage, apart from Safari, so it can't see the sign in you
   did in Safari. While you're signed in here in Safari, the page holds a one time app key (from the
   sheet) and puts it in the home screen link: the start address in the app's manifest, and the
   address bar too, in case the phone ignores the manifest. The first time the installed app opens it
   trades the key for its own sign in. Only the installed app uses a key; Safari strips it. */
var AD_IOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function adStandalone() { return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true; }
var AD_START_KEY = (function () {
  var m = /[?&]k=([a-f0-9]{64})(?:&|$)/.exec(location.search);
  return m ? m[1] : '';
})();
function adCleanUrl(key) {
  var q = location.search.replace(/([?&])k=[^&]*(&|$)/, function (x, a, b) { return b ? a : ''; }).replace(/^&/, '?');
  if (q === '?') q = '';
  if (key) q += (q ? '&' : '?') + 'k=' + key;
  try { history.replaceState(history.state, '', location.pathname + q + location.hash); } catch (e) {}
}
function adApplyAppKey() {
  if (!AD_IOS || adStandalone()) return;
  var key = '';
  try {
    var saved = JSON.parse(localStorage.getItem('ad.appKey') || 'null');
    if (localStorage.getItem('ad.session') && saved && Date.now() - saved.at < 25 * 864e5) key = saved.k;
  } catch (e) {}
  var base = location.origin + location.pathname.replace(/[^\/]*$/, '');
  var link = document.querySelector('link[rel=manifest]');
  if (link) {
    if (!key) { link.setAttribute('href', 'manifest.webmanifest'); }
    else {
      var icon = function (f, size, purpose) { return { src: base + 'icons/' + f, sizes: size, type: 'image/png', purpose: purpose }; };
      var man = {
        name: 'Club Music', short_name: 'Club Music',
        description: 'Our weekly album club: rate this week\'s pick, add yours, see the leaderboard.',
        id: base, start_url: base + '?k=' + key, scope: base,
        display: 'standalone', orientation: 'portrait', background_color: '#1e1b2e', theme_color: '#1e1b2e',
        icons: [icon('icon-192.png', '192x192', 'any'), icon('icon-512.png', '512x512', 'any'), icon('maskable-512.png', '512x512', 'maskable')]
      };
      link.setAttribute('href', 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(man)));
    }
  }
  adCleanUrl(key);
}
try { if (AD_START_KEY && !adStandalone()) adCleanUrl(''); adApplyAppKey(); } catch (e) {}
</script>
<script>
/* Light / dark mode: 'auto' follows the phone's setting. Set before the page draws so there's no flash. */
(function () {
  var t = 'auto'; try { t = localStorage.getItem('ad.theme') || 'auto'; } catch (e) {}
  var dark = t === 'dark' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  if (dark) { var m = document.querySelector('meta[name=theme-color]'); if (m) m.setAttribute('content', '#181524'); }
})();
</script>

  .btn { display: inline-block; text-decoration: none; border: 0; border-radius: 99px; padding: 9px 16px; font-weight: 700; font-size: 13px; cursor: pointer; }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn.spotify { background: #1db954; color: #fff; }
  .btn.apple { background: #fa2d48; color: #fff; }
  .btn.primary { background: var(--plum); color: #fff; }
  .btn.gold { background: var(--gold); color: #fff; }
  .btn.ghost { background: var(--band); color: var(--plum-text); }
  .waiting { margin-top: 14px; font-size: 13px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 3px; border-radius: 99px; font-size: 12px; font-weight: 700; margin: 3px 4px 0 0; color: var(--ink); vertical-align: middle; }
  .tiny { width: 20px; height: 20px; border-radius: 99px; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 900; overflow: hidden; flex: none; background: rgba(255,255,255,.6); }
  .tiny img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile .who2 { display: flex; align-items: center; gap: 8px; }
  .tile .who2 .mini { margin: 0; width: 26px; height: 26px; }
  td.n .nm { display: inline-flex; align-items: center; gap: 7px; }
  .bars .row span:first-child { display: inline-flex; align-items: center; gap: 7px; }

  /* up next strip */
  .next { display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center; }
  .pending { display: flex; align-items: center; gap: 14px; margin-top: 12px; }
  .pending .thumb { width: 72px; height: 72px; border-radius: 8px; flex: none; }
  .pending .pinfo { min-width: 0; }
  .pending .t1 { font-size: 18px; line-height: 1.25; }
  .pending .t2 { font-size: 14px; margin-top: 3px; }
  .pactions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .pactions .btn { padding: 11px 12px; font-size: 14px; text-align: center; }
  .phint { font-size: 12px; color: var(--muted); text-align: center; margin-top: 10px; }
  .next .thumb { width: 64px; height: 64px; }
  .next.empty { grid-template-columns: 1fr auto; background: var(--wait); border-color: var(--wait-edge); }
  .next .t1 { font-size: 17px; margin: 3px 0 2px; }
  .next.tap { cursor: pointer; }
  .next .chev { font-size: 26px; color: var(--muted); padding: 0 4px; line-height: 1; }
  .kickoff { color: var(--gold); }

  /* leaderboard: every row is the same height and the columns line up, whatever the text length */
  .board { list-style: none; margin: 0; padding: 0; }
  .board li { display: grid; grid-template-columns: 34px 52px minmax(0, 1fr) 84px; gap: 12px; align-items: center; height: 70px; padding: 0 10px; border-radius: 10px; cursor: pointer; position: relative; }
  .board li + li::before { content: ''; position: absolute; top: 0; left: 10px; right: 10px; border-top: 1px solid var(--line); }
  .board li:hover { background: var(--band); }
  .board li:hover::before, .board li:hover + li::before { border-color: transparent; }
  .board .rank { width: 30px; height: 30px; border-radius: 99px; display: flex; align-items: center; justify-content: center; font-size: 15px; justify-self: center; }
  .board li.m1 .rank { background: var(--medal-gold); box-shadow: inset 0 0 0 1.5px #f1d35a; }
  .board li.m2 .rank { background: var(--medal-silver); box-shadow: inset 0 0 0 1.5px var(--medal-silver-edge); }
  .board li.m3 .rank { background: var(--medal-bronze); box-shadow: inset 0 0 0 1.5px #e7b88f; }
  .board .pname { display: none; } /* the photo shows who picked it */
  .board-more { text-align: center; padding-top: 10px; }
  .board-wait { text-align: center; padding: 2px 0 10px; }
  .board.unranked .rank { color: var(--muted); font-weight: 600; }
  .board .binfo { min-width: 0; }
  .board .t1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .board .bline { display: flex; align-items: center; gap: 5px; white-space: nowrap; margin-top: 3px; min-width: 0; }
  .board .bline .art { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .board .bline .tiny, .board .bline .stag, .board .bline .bw { flex: none; }
  .board .score { white-space: nowrap; }
  .board .score .stars { font-size: 13px; }
  .rank { font-weight: 900; font-size: 18px; color: var(--plum-text); text-align: center; }
  .thumb { width: 52px; height: 52px; border-radius: 6px; object-fit: cover; background: var(--band); }
  .t1 { font-weight: 700; } .t2 { font-size: 12px; color: var(--muted); }
  .score { text-align: right; } .score b { font-size: 17px; display: block; }
  .stag { display: inline-block; font-size: 10px; font-weight: 900; letter-spacing: .5px; background: var(--band); color: var(--plum2); border-radius: 4px; padding: 1px 5px; }

  /* rate */
  select, textarea, input[type=text], input[type=search], input[type=number] { width: 100%; font: inherit; font-size: 16px; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  select { font-weight: 700; }
  textarea { resize: vertical; min-height: 84px; line-height: 1.4; }
  /* Rate tab: cover on the left, album info and score on the right */
  .ratehead { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 18px; align-items: center; margin-top: 18px; }
  .ratehead .cover { box-shadow: 0 6px 18px rgba(30,27,46,.25); }
  .ratehead .rc-t { font-weight: 800; font-size: 18px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ratehead .rc-a { font-size: 14px; color: var(--muted); margin-top: 4px; display: flex; flex-direction: column; gap: 4px; }
  .ratehead .rc-art { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ratehead .rc-by { display: inline-flex; align-items: center; gap: 5px; }
  .ratehead .slider { text-align: left; margin: 10px 0 0; }
  .ratehead .slider .big { font-size: 44px; }
  .ratehead .slider .stars { font-size: 22px; min-height: 28px; margin-top: 2px; }
  .ratehead + input[type=range] { margin-top: 16px; }
  .slider { text-align: center; margin: 22px 0 8px; }
  .slider .big { font-size: 56px; font-weight: 900; line-height: 1; }
  .slider .stars { font-size: 30px; display: block; min-height: 38px; margin-top: 4px; }
  input[type=range] { width: 100%; accent-color: var(--plum2); height: 34px; }
  .scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
  .extras { margin-top: 20px; border-top: 1px solid var(--band); padding-top: 16px; display: grid; gap: 14px; }
  .field label { display: block; margin-bottom: 6px; }
  .field .hint { font-size: 12px; color: var(--muted); margin-top: 4px; display: flex; justify-content: space-between; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .msg { margin-top: 12px; padding: 10px 12px; border-radius: 10px; font-weight: 700; display: none; }
  .msg.ok { display: block; margin-bottom: 12px; background: var(--ok-bg); color: var(--ok-text); } .msg.err { display: block; background: var(--err-bg); color: var(--err-text); }
  .todo { margin-top: 10px; font-size: 13px; }

  /* add album */
  .searchrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  .searchrow .btn { padding: 0 20px; font-size: 15px; }
  .results { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-top: 14px; }
  .res { background: var(--card); border: 2px solid var(--line); border-radius: 12px; overflow: hidden; cursor: pointer; text-align: left; padding: 0; color: var(--ink); }
  .res:hover { border-color: var(--plum2); }
  .res .cover { border-radius: 0; }
  .res .info { padding: 8px 9px 10px; } .res .t1 { font-size: 13px; line-height: 1.2; }
  .tag { display: inline-block; font-size: 10px; font-weight: 900; letter-spacing: .6px; text-transform: uppercase; background: var(--band); color: var(--plum2); border-radius: 4px; padding: 1px 5px; margin-top: 4px; }
  .tag.warn { background: var(--wait); color: var(--warn-text); }
  .chosen { display: grid; grid-template-columns: 150px 1fr; gap: 18px; align-items: start; }
  .chosen .fields { display: grid; gap: 12px; }
  .note { font-size: 13px; padding: 10px 12px; border-radius: 10px; background: var(--band); margin-top: 12px; }
  .note.warn { background: var(--wait); }
  .linkish { background: none; border: 0; color: var(--plum2); font-weight: 700; font-size: 13px; cursor: pointer; padding: 0; text-decoration: underline; }
  .queue { list-style: none; margin: 0; padding: 0; }
  .queue li { display: grid; grid-template-columns: 74px 48px 1fr auto; gap: 12px; align-items: center; padding: 8px 6px; border-top: 1px solid var(--band); }
  .queue li:first-child { border-top: 0; }
  .queue li.divider { display: block; padding: 10px 6px 6px; border-top: 0; }
  .queue li.divider span { display: inline-block; background: var(--plum); color: #fff; font-size: 10px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; border-radius: 99px; padding: 3px 10px; }
  .queue .d { font-weight: 900; font-size: 13px; color: var(--plum-text); }
  .queue .thumb { width: 48px; height: 48px; }
  .queue .open { color: var(--muted); font-style: italic; }
  .queue .chip { margin: 0; }
  .queue li.tap { cursor: pointer; }

  /* grid */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .gcard { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; cursor: pointer; }
  .gcard .cover { border-radius: 0; }
  .gcard .info { padding: 9px 10px 11px; } .gcard .t1 { font-size: 14px; line-height: 1.2; }
  .gcard.m1 { outline: 4px solid #f1d35a; } .gcard.m2 { outline: 4px solid var(--medal-silver-edge); } .gcard.m3 { outline: 4px solid #e7b88f; }

  /* modal */
  .scrim { position: fixed; inset: 0; background: rgba(30,27,46,.6); display: none; align-items: flex-start; justify-content: center;
    padding: max(30px, calc(env(safe-area-inset-top) + 16px)) 12px max(30px, calc(env(safe-area-inset-bottom) + 16px));
    overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; z-index: 20; }
  body.locked { overflow: hidden; }
  .scrim.on { display: flex; }
  .modal { background: var(--card); border-radius: 16px; max-width: 620px; width: 100%; padding: 18px; position: relative; }
  .close { position: absolute; top: 10px; right: 12px; z-index: 1; border: 0; background: var(--band); width: 34px; height: 34px; border-radius: 99px; font-size: 18px; cursor: pointer; color: var(--ink); }
  /* album popup header: cover on the left, title beside it, tiles and buttons under the title */
  .mhero { --peek: 62px; display: grid; grid-template-columns: 190px 1fr; grid-template-areas: "cover head" "cover body"; column-gap: calc(20px + var(--peek)); align-items: start; }
  .mhero > .disc { grid-area: cover; }
  .mhead { grid-area: head; padding-right: 40px; }
  .mhead h2 { margin: 6px 0 2px; font-size: 24px; line-height: 1.15; }
  .mhead .by { font-size: 16px; color: var(--muted); margin-bottom: 12px; }
  .mbody { grid-area: body; }
  table.rt { width: 100%; border-collapse: collapse; margin-top: 12px; }
  table.rt td { padding: 9px 8px; border-top: 1px solid var(--band); font-size: 14px; vertical-align: top; }
  table.rt td.n { font-weight: 700; border-radius: 6px; white-space: nowrap; }
  .take { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .take q { font-style: italic; color: var(--ink); }
  .songs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
  .songs div { background: var(--band); border-radius: 10px; padding: 9px 12px; font-size: 14px; }
  .songs b { display: block; font-size: 10px; letter-spacing: .8px; color: var(--plum2); text-transform: uppercase; margin-bottom: 3px; }
  /* song picks: each picked song in track order, with who loved and who disliked it */
  .sp { list-style: none; margin: 4px 0 0; padding: 0; }
  .sp li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 2px; border-top: 1px solid var(--band); font-size: 14px; }
  .sp li:first-child { border-top: 0; }
  .sp .tn { color: var(--muted); font-size: 12px; font-weight: 700; text-align: right; }
  .sp .sn { overflow-wrap: anywhere; line-height: 1.25; }
  .sp .sn .tag { margin: 0 0 0 6px; vertical-align: 1px; }
  .sp .pk { display: flex; align-items: center; gap: 3px; flex-wrap: wrap; justify-content: flex-end; max-width: 150px; }
  .sp .pk .tiny { width: 24px; height: 24px; font-size: 11px; }
  .lv, .dl { font-weight: 900; font-size: 13px; line-height: 1; }
  .lv { color: var(--love); } .dl { color: var(--muted); }
  .sp .pk .lv, .sp .pk .dl { margin: 0 2px 0 5px; }
  .sp .pk .lv:first-child, .sp .pk .dl:first-child { margin-left: 0; }
  .sp-note { font-size: 12px; color: var(--muted); margin-top: 6px; }

  /* profile */
  .phead { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; padding-right: 40px; }
  .pbig { width: 64px; height: 64px; border-radius: 99px; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 900; flex: none; }
  .phead h2 { margin: 0; font-size: 24px; }
  .you { display: inline-block; background: var(--plum); color: #fff; font-size: 10px; font-weight: 900; letter-spacing: .8px; text-transform: uppercase; border-radius: 99px; padding: 2px 8px; vertical-align: middle; margin-left: 6px; }
  .owe { list-style: none; margin: 6px 0 0; padding: 0; }
  .owe a { color: var(--plum-text); font-weight: 700; text-decoration: none; }
  .owe li { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px solid var(--band); font-size: 14px; }

  /* members + stats */
  .mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .mcard h3 { margin: 0 0 10px; font-size: 20px; display: flex; align-items: center; }
  .kv { display: flex; justify-content: space-between; padding: 6px 0; border-top: 1px solid var(--band); font-size: 14px; gap: 10px; }
  .kv b { font-weight: 700; text-align: right; }
  .stat { display: grid; grid-template-columns: 64px 1fr; gap: 14px; align-items: center; }
  .stat .thumb { width: 64px; height: 64px; }
  .stat .lbl { }
  .bars .row { display: grid; grid-template-columns: 110px 1fr 40px; gap: 10px; align-items: center; margin: 8px 0; font-size: 14px; font-weight: 700; }
  .bars .track { background: var(--band); border-radius: 99px; height: 16px; overflow: hidden; }
  .bars .fill { background: var(--plum); height: 100%; border-radius: 99px; }
  /* the Procrastinator (stats) */
  .procrast .crown { display: flex; align-items: center; gap: 14px; }
  .procrast .crown .pwrap { position: relative; flex: none; }
  .procrast .crown .snail { position: absolute; right: -6px; bottom: -4px; font-size: 24px; line-height: 1; filter: drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
  .procrast .crown h3 { margin: 2px 0 2px; font-size: 22px; }
  /* crying filter over the procrastinator's photo: tear streams, rosy cheeks, falling drops */
  .procrast .crown .pwrap { display: flex; align-items: flex-end; }
  .cry { position: relative; display: inline-block; flex: none; border-radius: 99px; }
  .cry .pbig { position: relative; z-index: 0; }
  .cry svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 1; }
  .cry .flow { stroke-dasharray: 3 9; animation: tearflow .9s linear infinite; }
  .cry .drop { animation: teardrop 1.4s ease-in infinite; transform-box: fill-box; transform-origin: center; }
  .cry .drop.d2 { animation-delay: .7s; }
  @keyframes tearflow { to { stroke-dashoffset: -12; } }
  @keyframes teardrop { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(26px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .cry .flow, .cry .drop { animation: none; } }
  .pwrap.duo .cry + .cry { margin-left: -14px; }
  .pwrap.duo .cry .pbig { box-shadow: 0 0 0 3px var(--card); }
  .pwrap.trio .cry .pbig { width: 52px; height: 52px; font-size: 22px; box-shadow: 0 0 0 3px var(--card); }
  .pwrap.trio .cry + .cry { margin-left: -16px; }
  .procrast .crown { padding-bottom: 16px; border-bottom: 1px solid var(--band); margin-bottom: 4px; }
  .procrast .crown .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .procrast .pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 99px; padding: 3px 9px; font-size: 12px; font-weight: 700; letter-spacing: 0; text-transform: none; background: var(--band); color: var(--ink); white-space: nowrap; }
  .procrast .pill.bad { background: color-mix(in srgb, var(--red) 14%, transparent); color: var(--red); }
  .procrast .bars .row { grid-template-columns: 96px 1fr auto; gap: 10px; margin: 10px 0; }
  .procrast .bars .row > span:first-child { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; display: flex; }
  .procrast .bars .track { height: 12px; }
  .procrast .bars .fill { background: var(--red); }
  .procrast .bars .row.fast .fill { background: var(--gold); }
  .procrast .bars .val { display: flex; align-items: center; justify-content: flex-end; gap: 6px; width: 112px; white-space: nowrap; }
  .procrast .bars .owes { font-size: 11px; font-weight: 800; color: var(--red); background: color-mix(in srgb, var(--red) 14%, transparent); border-radius: 99px; padding: 2px 7px; }
  .procrast .bars .zap { font-size: 11px; font-weight: 800; color: var(--gold); background: color-mix(in srgb, var(--gold) 16%, transparent); border-radius: 99px; padding: 2px 7px; }
  .procrast .lbl { font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }
  .procrast .shame { list-style: none; margin: 4px 0 0; padding: 0; }
  .procrast .shame li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--band); font-size: 13px; cursor: pointer; }
  .procrast .shame li:first-child { border-top: 0; }
  .procrast .shame li .al { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  .procrast .shame li .al b, .procrast .shame li .al small { display: block; overflow: hidden; text-overflow: ellipsis; }
  .procrast .shame li .al b { color: var(--ink); }
  .procrast .shame li .al small { font-size: 12px; }
  .procrast .shame .faces2 { display: inline-flex; flex: none; }
  .procrast .shame .faces2 .tiny + .tiny { margin-left: -6px; box-shadow: 0 0 0 2px var(--card); }
  .procrast .shame li .days { color: var(--red); font-weight: 800; white-space: nowrap; }
  .procrast .sub { margin: 18px 0 2px; padding-top: 14px; border-top: 1px solid var(--band); }
  .procrast .sub.first { margin-top: 14px; padding-top: 0; border-top: 0; }

  /* app: sign in, install tip, refresh */
  .signin { max-width: 460px; margin: 30px auto; text-align: center; padding: 26px 20px; }
  .signin h2 { margin: 8px 0 8px; font-size: 26px; }
  .signin .logo { width: 84px; height: 84px; border-radius: 20px; display: block; margin: 0 auto 14px; }
  .who { display: grid; gap: 10px; margin-top: 18px; }
  .who button { display: flex; align-items: center; gap: 12px; border: 0; border-radius: 14px; padding: 12px 14px; font-weight: 700; font-size: 17px; cursor: pointer; color: var(--ink); text-align: left; }
  .who button .mini { width: 40px; height: 40px; font-size: 17px; margin: 0; }
  .who button:disabled { opacity: .6; }
  .codebox { text-align: center; font-size: 30px !important; font-weight: 900; letter-spacing: 10px; margin: 18px 0 12px; }
  .btn.big { width: 100%; padding: 14px; font-size: 16px; }
  .row2 { display: flex; justify-content: space-between; margin-top: 14px; }
  .install { display: flex; gap: 14px; align-items: center; background: var(--plum); color: #fff; border: 0; }
  .install img { width: 48px; height: 48px; border-radius: 12px; flex: none; }
  .install .t2 { color: #d9d4e2; }
  .install .x { margin-left: auto; background: none; border: 0; color: #d9d4e2; font-size: 22px; cursor: pointer; padding: 4px 8px; }
  /* refresh indicator: a thin gold line sweeping along the bottom edge of the header */
  .syncing { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; overflow: hidden; opacity: 0; transition: opacity .3s; pointer-events: none; font-size: 0; color: transparent; }
  .syncing.on { opacity: 1; }
  .syncing::before { content: ''; position: absolute; top: 0; bottom: 0; left: -40%; width: 40%; background: linear-gradient(90deg, transparent, var(--gold), transparent); animation: syncSweep 1.1s ease-in-out infinite; }
  @keyframes syncSweep { from { left: -40%; } to { left: 100%; } }
  @media (prefers-reduced-motion: reduce) { .syncing::before { left: 0; width: 100%; animation: none; background: var(--gold); opacity: .6; } }

  /* ---------- motion and graphics ---------- */
  /* vinyl record that sits behind the cover in the album popup */
  .disc { position: relative; }
  .disc .cover { position: relative; z-index: 1; box-shadow: 0 6px 18px rgba(30,27,46,.28); }
  .vinyl { position: absolute; top: 4%; left: 4%; width: 92%; height: 92%; z-index: 0; transform: translateX(var(--peek)); }
  .rec { position: relative; width: 100%; height: 100%; border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0 6%, rgba(255,255,255,.16) 11%, transparent 17% 52%, rgba(255,255,255,.1) 57%, transparent 63%),
      repeating-radial-gradient(circle at 50% 50%, #17141f 0 2px, #26222f 2px 3px);
    box-shadow: 0 6px 16px rgba(0,0,0,.35), inset 0 0 0 2px #0d0b12; }
  .rec::before { content: ''; position: absolute; inset: 32%; border-radius: 50%;
    background: radial-gradient(circle at 50% 22%, rgba(255,255,255,.85) 0 7%, transparent 7.5%), rgb(var(--glow));
    box-shadow: inset 0 0 0 2px rgba(0,0,0,.18); }
  .rec::after { content: ''; position: absolute; left: 50%; top: 50%; width: 6%; height: 6%; margin: -3% 0 0 -3%; border-radius: 50%; background: #f3f1f8; }
  .vinyl::after { content: ''; position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle at 30% 25%, rgba(255,255,255,.12), transparent 55%); }

  /* album color glow: tint behind the popup header plus a colored halo */
  .modal { --glow: 108 92 157; isolation: isolate; transition: box-shadow .6s ease; }
  .modal::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 320px; border-radius: 16px 16px 0 0; z-index: -1; pointer-events: none;
    background: linear-gradient(180deg, rgb(var(--glow) / .32), rgb(var(--glow) / 0)); opacity: 0; transition: opacity .5s ease; }
  .modal.album.glowing::before { opacity: 1; }
  .modal.album.glowing { box-shadow: 0 18px 70px -8px rgb(var(--glow) / .8); }

  /* swipe between tabs: the next tab rides in beside the current one while you drag (like a phone carousel) */
  body { overflow-x: hidden; overflow-x: clip; }
  /* the browser only handles up and down scrolling (and pinch zoom) on the page; sideways drags are left to the swipe,
     so the two never both move at once. Sideways scrolling strips set their own touch-action and still scroll. */
  #app { touch-action: pan-y pinch-zoom; }
  main.dragging, .peek > main { will-change: transform; backface-visibility: hidden; }
  main.dragging *, .peek * { transition: none !important; }
  main.dragging :active { transform: none !important; }
  .peek { position: fixed; left: 0; right: 0; bottom: 0; overflow: hidden; pointer-events: none; z-index: 1; }
  .peek > main { min-height: 100%; }
  .peek > main > * { animation: none !important; }

  /* sliding gold underline under the tabs */
  .ink { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--gold); border-radius: 3px 3px 0 0; pointer-events: none; }
  .ink.ready { transition: transform .38s cubic-bezier(.2,.8,.2,1), width .38s cubic-bezier(.2,.8,.2,1); }
  nav.inked button.on { border-bottom-color: transparent; }

  /* confetti layer */
  .confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }

  /* spinning record while loading */
  .loading::before { content: ''; display: block; width: 58px; height: 58px; margin: 0 auto 16px; border-radius: 50%;
    background: radial-gradient(circle, var(--canvas) 0 5%, transparent 5.5%), radial-gradient(circle at 50% 36%, #fff 0 4%, transparent 4.5%),
      radial-gradient(circle, var(--gold) 0 30%, transparent 30.5%), repeating-radial-gradient(circle, #1e1b2e 0 2px, #2e2a40 2px 3px);
    box-shadow: 0 4px 12px rgba(0,0,0,.25); }

  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  @keyframes fadeIn { from { opacity: 0; } }
  @keyframes fadeOut { to { opacity: 0; } }
  @keyframes sheetUp { from { opacity: 0; transform: translateY(48px) scale(.97); } }
  @keyframes sheetDown { to { opacity: 0; transform: translateY(36px) scale(.98); } }
  @keyframes coverIn { from { opacity: 0; transform: scale(.82) rotate(-5deg); } }
  @keyframes slideOut { from { transform: translateX(0) rotate(-40deg); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes grow { from { transform: scaleX(0); } }
  @keyframes pop { 40% { transform: scale(1.18); } }
  @keyframes shimmer { 0%, 72% { transform: translateX(-120%); } 100% { transform: translateX(120%); } }

  @media (prefers-reduced-motion: no-preference) {
    /* pages fade up when you switch tabs; list items follow one after another */
    main.enter > * { animation: rise .42s cubic-bezier(.2,.8,.2,1) backwards; }
    main.enter > *:nth-child(2) { animation-delay: .05s; } main.enter > *:nth-child(3) { animation-delay: .1s; }
    main.enter > *:nth-child(4) { animation-delay: .15s; } main.enter > *:nth-child(n+5) { animation-delay: .2s; }
    .stagger { animation: rise .45s cubic-bezier(.2,.8,.2,1) backwards; animation-delay: calc(.08s + var(--i, 0) * 40ms); }
    main.enter .bars .fill { transform-origin: left; animation: grow .9s cubic-bezier(.2,.8,.2,1) backwards; animation-delay: calc(.2s + var(--i, 0) * 70ms); }

    /* popup slides up like an iPhone sheet */
    .scrim.on { animation: fadeIn .22s ease backwards; }
    .scrim.on .modal { animation: sheetUp .45s cubic-bezier(.2,.9,.3,1.08) backwards; }
    .scrim.closing { animation: fadeOut .22s ease forwards; }
    .scrim.closing .modal { animation: sheetDown .22s ease-in forwards; }
    .scrim.on .disc .cover { animation: coverIn .5s cubic-bezier(.2,.9,.3,1.15) .08s backwards; }
    .scrim.on .vinyl { animation: slideOut .8s cubic-bezier(.2,.8,.2,1) .28s backwards; }
    .rec { animation: spin 2.6s linear infinite; }
    .loading::before { animation: spin 1.4s linear infinite; }

    /* taps feel physical */
    .btn, nav button, .seg button, .who button, .close, .res { transition: transform .12s ease; }
    .btn:active, .seg button:active, .who button:active, .close:active, .res:active { transform: scale(.95); }
    .board li, .gcard, .queue li.tap, .card[onclick] { transition: transform .15s ease, box-shadow .2s ease; }
    .board li:active, .gcard:active, .queue li.tap:active, .card[onclick]:active { transform: scale(.98); }
    .pop { animation: pop .25s ease; }

    /* gold medal shimmer */
    .board li.m1 .rank, .gcard.m1 { position: relative; overflow: hidden; }
    .board li.m1 .rank::after, .gcard.m1::after { content: ''; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(105deg, transparent 35%, var(--shine) 50%, transparent 65%); animation: shimmer 5s ease-in-out 1.2s infinite backwards; transform: translateX(-120%); }
  }
  @media (hover: hover) and (prefers-reduced-motion: no-preference) {
    .gcard:hover { transform: translateY(-3px); box-shadow: 0 10px 22px var(--shadow); }
  }

  @media (max-width: 600px) {
    .hero { grid-template-columns: 1fr; }
    .hart { max-width: 300px; width: 100%; margin: 6px auto 4px; }
    .waiting .hart { max-width: 160px; margin-top: 10px; }
    .waiting > div:last-child { text-align: center; }
    .card.hero, html[data-theme="dark"] .card.hero { background: radial-gradient(110% 70% at 50% 0%, rgb(var(--glow) / .12), transparent 55%), var(--card); }
    .hero h2 { font-size: 26px; }
    .board li { grid-template-columns: 24px 46px minmax(0, 1fr) 72px; gap: 10px; height: 64px; padding: 0 8px; }
    .board .score b { font-size: 16px; }
    .board .score .stars { font-size: 11px; }
    .board .rank { width: 24px; height: 24px; font-size: 13px; }
    .bigavg b { font-size: 28px; }
    /* Rate it button full width (album name is the listen link now) */
    .hero .listen { display: grid; grid-template-columns: 1fr; }
    .hero .listen .btn { justify-content: center; text-align: center; padding: 11px 12px; }
    .thumb { width: 46px; height: 46px; }
    .two, .songs { grid-template-columns: 1fr; }
    .chosen { grid-template-columns: 1fr; }
    .chosen .cover { max-width: 200px; }
    .ratehead { grid-template-columns: 118px minmax(0, 1fr); gap: 14px; }
    .ratehead .rc-t { font-size: 16px; }
    .ratehead .slider .big { font-size: 38px; }
    .ratehead .slider .stars { font-size: 20px; min-height: 24px; }
    .next { grid-template-columns: 56px 1fr; }
    .next.tap { grid-template-columns: 56px 1fr auto; }
    .next .thumb { width: 56px; height: 56px; }
    .next > .btn { grid-column: 1 / -1; }
    .next.empty { grid-template-columns: 1fr; }
    .results { grid-template-columns: repeat(2, 1fr); }
    .queue li { grid-template-columns: 54px 42px 1fr auto; gap: 10px; }
    .queue .thumb { width: 42px; height: 42px; }
    .brand h1 { font-size: 19px; }
    .theme-btn { width: 34px; height: 34px; } .theme-btn svg { width: 18px; height: 18px; }
    /* album popup on phones: small cover beside the title, everything else full width below */
    .scrim { padding-left: 8px; padding-right: 8px; }
    .modal { padding: 14px; }
    .mhero { --peek: 34px; grid-template-columns: 88px 1fr; grid-template-areas: "cover head" "body body"; column-gap: calc(12px + var(--peek)); align-items: center; }
    .mhead { padding-right: 34px; min-width: 0; }
    .mhead h2 { font-size: 21px; overflow-wrap: anywhere; }
    .mhead .by { font-size: 14px; margin-bottom: 0; }
    .mbody { margin-top: 14px; }
    .mbody .tile { flex: 1 1 auto; }
    .mbody .listen .btn { flex: 1; text-align: center; }
  }
</style>
</head>
<body>
<header>
  <div class="brand"><h1>Club Music</h1>
    <select class="season-pick" id="season" onchange="pickSeason(this.value)" aria-label="Season"><option>Season</option></select>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" aria-label="Switch light or dark mode" title="Switch light or dark mode">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a.6.6 0 0 0-.8-.7A9.5 9.5 0 1 0 21.2 15.4a.6.6 0 0 0-.7-.8z"/></svg>
    </button>
    <button class="avatar" id="avatar" style="display:none" onclick="openProfile()" aria-label="Your profile"></button></div>
  <nav id="nav" class="inked">
    <span class="ink" id="ink"></span>
    <button data-v="home" class="on">Home</button>
    <button data-v="rate">Rate</button>
    <button data-v="add">Add Album</button>

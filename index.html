    <button data-v="members">Members</button>
  </nav>
  <div class="syncing" id="syncing" role="status">Updating…</div>
</header>
<main id="app"><div class="loading">Loading this week's album…</div></main>
<div class="scrim" id="scrim"><div class="modal" id="modal"></div></div>

<script>
var AVATARS = {};
var FACES = {};
var COLORS = { Brennan: '#dbe8fa', Jonathan: '#e6ddf6', William: '#fae3d1', Luke: '#d8f0e3', Nathan: '#fadfec' };
var FALLBACK = ['#e3f2fd', '#fff3e0', '#e8f5e9', '#fce4ec', '#ede7f6', '#e0f7fa'];
var COLORS_DARK = { Brennan: '#2a3b57', Jonathan: '#3b3159', William: '#523a28', Luke: '#22463a', Nathan: '#55293f' };
var FALLBACK_DARK = ['#22384f', '#4d3a22', '#24432c', '#4f2737', '#362d55', '#1f4448'];
var D = null, ranked = [], seasonRanks = {}, seasonSel = null, seasonPicked = false, view = 'home';
var rateState = { member: null, row: null, score: 7, fav: '', least: '', comment: '' };
var addState = { query: '', results: null, searching: false, picked: null, changeRow: null, flash: null };

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function jsq(s) { return esc(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }
function isDark() { return document.documentElement.getAttribute('data-theme') === 'dark'; }
/* A member's color. pastel=true always gives the light version (used for glows and confetti). */
function color(name, pastel) {
  var dark = isDark() && !pastel, set = dark ? COLORS_DARK : COLORS, fb = dark ? FALLBACK_DARK : FALLBACK;
  if (set[name]) return set[name]; var i = D ? D.members.indexOf(name) : -1; return fb[(i < 0 ? 0 : i) % fb.length];
}
function stars(v) { if (v == null) return ''; var h = Math.round(v); return '★'.repeat(Math.floor(h / 2)) + (h % 2 ? '½' : ''); }
function fmt(v) { return v == null ? '' : v.toFixed(2); }
function num(v) { return v == null ? '' : String(Math.round(v * 100) / 100); }
function fmtDate(s, long) { if (!s) return ''; var p = s.split('-'); var d = new Date(+p[0], +p[1] - 1, +p[2]); return d.toLocaleDateString('en-US', long ? { weekday: 'long', month: 'long', day: 'numeric' } : { month: 'short', day: 'numeric' }); }
function img(a, cls) { return a.cover ? '<img class="' + cls + '" src="' + esc(a.cover) + '" alt="">' : '<div class="' + cls + '"></div>'; }
/* A member's club photo, or their initial on their color if there's no photo. */
function face(name, cls) {
  var url = AVATARS[name];
  var bg = 'background:' + color(name);
  if (!url) return '<span class="' + cls + '" style="' + bg + '">' + esc(name.charAt(0)) + '</span>';
  return '<span class="' + cls + '" style="' + bg + '"><img src="' + esc(url) + '" alt="" onerror="this.parentNode.textContent=\'' + jsq(name.charAt(0)) + '\'"></span>';
}
function toast(text) {
  var t = document.createElement('div'); t.className = 'toast'; t.textContent = text;
  document.body.appendChild(t); setTimeout(function () { t.remove(); }, 3500);
}
function canRemove(a) {
  return a && rateState.member && a.count === 0 && a.date && a.date >= D.today && (a.pickedBy === rateState.member || (D.me && D.me.admin));
}
function chip(name) { return '<span class="chip" style="background:' + color(name) + '">' + face(name, 'tiny') + esc(name) + '</span>'; }
/* Rank inside the album's own season (each season has its own medals). */
/* Ranks and medals only start once a board has at least MIN_RANKED rated albums (one album alone isn't "#1"). */
var MIN_RANKED = 2;
function isRanking(list) { return list.length >= MIN_RANKED; }
function rankOf(a) { var list = seasonRanks[a.season] || []; var i = list.indexOf(a); return i < 0 || !isRanking(list) ? null : i + 1; }
function medalClass(a) { var r = rankOf(a); return r && r <= 3 ? 'm' + r : ''; }
function storeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function storeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function isQuiet(s) { return !s || s === 'No agreement yet'; }

/* ---------- light / dark mode ---------- */

function themePref() { var t = storeGet('ad.theme'); return t === 'light' || t === 'dark' ? t : 'auto'; }
function systemDark() { return !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches); }
function applyTheme(animate) {
  var t = themePref(), dark = t === 'dark' || (t === 'auto' && systemDark()), root = document.documentElement;
  if (root.getAttribute('data-theme') === (dark ? 'dark' : 'light')) return;
  if (animate && !calm()) { root.classList.add('theming'); setTimeout(function () { root.classList.remove('theming'); }, 350); }
  root.setAttribute('data-theme', dark ? 'dark' : 'light');
  var meta = document.querySelector('meta[name=theme-color]'); if (meta) meta.setAttribute('content', dark ? '#181524' : '#1e1b2e');
  // redraw what's on screen so member colors switch too
  if (!D || !storeGet('ad.session')) { if (typeof signState !== 'undefined' && document.querySelector('.signin .who, .signin .codebox')) renderSignIn(); return; }
  var av = document.getElementById('avatar'); if (rateState.member) av.style.background = color(rateState.member);
  if (view) show(view);
  var sc = document.getElementById('scrim');
  if (sc.classList.contains('on') && document.querySelector('#modal .phead')) { var y = sc.scrollTop; openProfile(); sc.scrollTop = y; }
}
function setTheme(t) { storeSet('ad.theme', t); applyTheme(true); refreshThemeSeg(); }
/* header button: flips between light and dark (and stops following the phone) */
function toggleTheme() { setTheme(isDark() ? 'light' : 'dark'); }
function themeSeg() {
  var t = themePref();
  return '<div class="seg" id="themeSeg">' + [['auto', 'Match phone'], ['light', 'Light'], ['dark', 'Dark']].map(function (o) {
    return '<button data-t="' + o[0] + '" class="' + (t === o[0] ? 'on' : '') + '" onclick="setTheme(\'' + o[0] + '\')">' + o[1] + '</button>';
  }).join('') + '</div>';
}
function refreshThemeSeg() {
  var t = themePref();
  Array.prototype.forEach.call(document.querySelectorAll('#themeSeg button'), function (b) { b.classList.toggle('on', b.dataset.t === t); });
}
if (window.matchMedia) {
  var mq = matchMedia('(prefers-color-scheme: dark)'), onSys = function () { if (themePref() === 'auto') applyTheme(true); };
  if (mq.addEventListener) mq.addEventListener('change', onSys); else if (mq.addListener) mq.addListener(onSys);
}

/* ---------- preferred streaming platform ---------- */

/* Each member picks Spotify or Apple Music under their profile (saved on this phone).
   Album names, artist names and songs then open there. Before they pick, the first tap asks. */
var PLATFORMS = { spotify: 'Spotify', apple: 'Apple Music' };
function platformPref() {
  var p = storeGet('ad.platform');
  if (!PLATFORMS[p]) p = D && D.me && D.me.platform;
  return PLATFORMS[p] ? p : '';
}
/* Saves the choice on this phone AND to the member's account on the server, so it sticks
   even if iOS drops the phone copy, and follows them to other devices. */
function savePlatform(p) {
  storeSet('ad.platform', p);
  storeSet('ad.platformSync', '1'); // cleared once the server has it
  if (D && D.me) { D.me.platform = p; storeSet('ad.data', JSON.stringify(D)); }
  if (!storeGet('ad.session')) return;
  platformStatus = 'saving';
  api('setPlatform', [p]).then(function () {
    // The flag stays until a later load confirms the account has it (a load that was
    // already on its way could still carry the old choice).
    if (storeGet('ad.platform') === p) platformStatus = 'saved';
    refreshPlatformNote();
  }, function (e) {
    platformStatus = 'Couldn\'t save to your account: ' + ((e && e.message) || e) + ' It\'s kept on this phone and will try again.';
    refreshPlatformNote();
  });
}
var platformStatus = '';
function refreshPlatformNote() {
  var el = document.getElementById('platNote');
  if (el) el.textContent = platformNote();
}
function platformNote() {
  var p = platformPref();
  if (!p) return 'Not picked yet. Choose where album names, artist names and songs should open.';
  if (platformStatus === 'saving') return 'Saving ' + PLATFORMS[p] + ' to your account…';
  if (platformStatus === 'saved') return 'Saved to your account: ' + PLATFORMS[p] + '.';
  if (platformStatus) return platformStatus;
  return 'Album names, artist names and songs open in ' + PLATFORMS[p] + '.';
}
/* On each data load: the account's choice wins, unless this phone has a change the server hasn't got yet. */
function syncPlatform(data) {
  var me = data.me || {}, local = storeGet('ad.platform');
  if (!me.name) return;
  var pending = storeGet('ad.platformSync');
  if (pending && PLATFORMS[local] && me.platform === local) {
    storeDel('ad.platformSync'); // the account has it now
  } else if (PLATFORMS[local] && (pending || !PLATFORMS[me.platform])) {
    me.platform = local; // this phone's newer choice wins over a load that started before it was saved
    if (!pending || platformStatus !== 'saving') savePlatform(local);
  } else if (PLATFORMS[me.platform]) {
    storeSet('ad.platform', me.platform);
  }
}
function albumUrl(a, p) { return p === 'apple' ? a.apple : a.spotify; }
function artistUrl(a, p) {
  var u = p === 'apple' ? a.appleArtist : a.spotifyArtist;
  if (u) return u;
  var q = encodeURIComponent(a.artist || '');
  return p === 'apple' ? 'https://music.apple.com/us/search?term=' + q : 'https://open.spotify.com/search/' + q + '/artists';
}
/* Album name that opens the album on the member's platform (stops the tap from also opening the popup). */
function albumLink(a, cls) {
  if (!a.album) return '';
  var p = platformPref(), c = 'alblink' + (cls ? ' ' + cls : '');
  if (!p) return '<a class="' + c + '" href="#" onclick="event.stopPropagation();askPlatform(\'album\',' + a.row + ');return false" title="Listen">' + esc(a.album) + '</a>';
  var u = albumUrl(a, p);
  if (!u) return esc(a.album);
  return '<a class="' + c + '" href="' + esc(u) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="' + esc('Listen on ' + PLATFORMS[p]) + '">' + esc(a.album) + '</a>';
}
/* Artist name that opens the artist's page (stops the tap from also opening the album popup). */
function artistLink(a, cls) {
  if (!a.artist) return '';
  var p = platformPref(), c = 'artlink' + (cls ? ' ' + cls : '');
  if (!p) return '<a class="' + c + '" href="#" onclick="event.stopPropagation();askPlatform(\'artist\',' + a.row + ');return false">' + esc(a.artist) + '</a>';
  return '<a class="' + c + '" href="' + esc(artistUrl(a, p)) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="' + esc(a.artist + ' on ' + PLATFORMS[p]) + '">' + esc(a.artist) + '</a>';
}
var askFor = null;
function askPlatform(kind, row, song) {
  var fromAlbum = document.getElementById('scrim').classList.contains('on') && !!document.querySelector('#modal .mhead');
  askFor = { kind: kind, row: row, song: song, back: fromAlbum };
  document.getElementById('modal').innerHTML = '<button class="close" onclick="closeAlbum()">×</button>' +
    '<div style="padding-right:40px"><div class="eyebrow">Listen on</div><h2 style="margin:4px 0 6px">Where do you listen?</h2>' +
    '<div class="t2">Pick once and every album name, artist name and song opens there. You can change it anytime under your profile.</div></div>' +
    '<div class="pickplat"><button class="btn spotify" onclick="choosePlatform(\'spotify\')">Spotify</button>' +
    '<button class="btn apple" onclick="choosePlatform(\'apple\')">Apple Music</button></div>';
  openScrim();
}
function choosePlatform(p) {
  var f = askFor, a = f && albumByRow(f.row);
  askFor = null;
  savePlatform(p);
  if (a && f.kind === 'song') openSong(a, f.song, p);
  else if (a) window.open(f.kind === 'artist' ? artistUrl(a, p) : albumUrl(a, p), '_blank', 'noopener');
  if (view) show(view);
  if (a && f.back) openAlbum(a.row); else closeAlbum();
}
/* ---------- songs that play on tap ---------- */

/* Direct song links, looked up by the server once and remembered on this phone
   (ad.songLinks2, keyed "platform|row|album|song"; was ad.songLinks until the Nov 12, 2026 explicit version fix, which drops the old store). Until one is known, a tap searches for the song. */
var songMemo = null, songLoading = {};
function songMemoGet() {
  if (!songMemo) { storeDel('ad.songLinks'); try { songMemo = JSON.parse(storeGet('ad.songLinks2') || '{}') || {}; } catch (e) { songMemo = {}; } }
  return songMemo;
}
function songKey(p, a, song) { return p + '|' + a.row + '|' + a.album + '|' + song; }
/* "Song Name (2 votes)" from the sheet's group columns -> "Song Name" */
function songName(s) { return String(s || '').replace(/\s*\(\d+ votes?\)\s*$/i, '').trim(); }
function songSearchUrl(a, song, p) {
  var q = encodeURIComponent(song + ' ' + (a.artist || ''));
  return p === 'apple' ? 'https://music.apple.com/us/search?term=' + q : 'https://open.spotify.com/search/' + q;
}
function songUrl(a, song, p) { return songMemoGet()[songKey(p, a, song)] || ''; }
/* A song title that plays the song. label = what to show (defaults to the song). */
function songLink(a, song, label) {
  song = songName(song);
  if (!song) return esc(label || '');
  var p = platformPref(), text = '<span class="play ' + (p || 'none') + '" aria-hidden="true"></span>' + esc(label || song);
  var data = ' data-row="' + a.row + '" data-song="' + esc(song) + '"';
  if (!p) return '<a class="songlink" href="#"' + data + ' onclick="event.stopPropagation();askPlatform(\'song\',' + a.row + ',this.dataset.song);return false">' + text + '</a>';
  var u = songUrl(a, song, p);
  return '<a class="songlink" href="' + esc(u || songSearchUrl(a, song, p)) + '"' + data + (u ? ' data-ok="1"' : '') +
    ' target="_blank" rel="noopener" title="' + esc('Play on ' + PLATFORMS[p]) + '" onclick="return songTap(event, this)">' + text + '</a>';
}
/* Every song shown in an album's popup: group picks plus each member's favorite and least favorite. */
function albumSongs(a) {
  var list = [songName(a.groupLeast), songName(a.groupFav)];
  D.members.forEach(function (m) { list.push(a.least[m], a.fav[m]); });
  return list.filter(function (x, i) { return x && !isQuiet(x) && list.indexOf(x) === i; });
}
/* Asks the server for the songs this phone doesn't have links for yet, then fixes up the links on screen. */
function loadSongLinks(a, p, songs) {
  p = p || platformPref();
  if (!a || !p || !storeGet('ad.session')) return Promise.resolve();
  var memo = songMemoGet();
  var need = (songs || albumSongs(a)).filter(function (x) { return !memo[songKey(p, a, x)]; });
  if (!need.length) return Promise.resolve();
  var lk = p + '|' + a.row + '|' + need.join('\n');
  if (songLoading[lk]) return songLoading[lk];
  songLoading[lk] = api('songLinks', [a.row, p, need]).then(function (res) {
    Object.keys(res || {}).forEach(function (song) {
      // Search links aren't saved, so a later tap can try again once the song turns up.
      if (/\/search/.test(res[song])) return;
      memo[songKey(p, a, song)] = res[song];
    });
    storeSet('ad.songLinks2', JSON.stringify(memo));
    Array.prototype.forEach.call(document.querySelectorAll('a.songlink[data-row="' + a.row + '"]'), function (el) {
      var u = memo[songKey(p, a, el.dataset.song)];
      if (u) { el.href = u; el.dataset.ok = '1'; }
    });
  }).catch(function () { /* the search link stays */ }).then(function () { delete songLoading[lk]; });
  return songLoading[lk];
}
/* Tap on a song. Known link: let it open normally (so Spotify / Apple Music can take over).
   Not known yet: open a tab right away (phones block tabs opened later), then point it at the song. */
function songTap(ev, el) {
  ev.stopPropagation();
  if (el.dataset.ok) return true;
  var a = albumByRow(Number(el.dataset.row));
  if (!a) return true;
  ev.preventDefault();
  openSong(a, el.dataset.song, platformPref());
  return false;
}
function openSong(a, song, p) {
  var known = songUrl(a, song, p);
  if (known) { window.open(known, '_blank', 'noopener'); return; }
  var w = null;
  try { w = window.open('', '_blank'); } catch (e) {}
  if (w) { try { w.document.title = 'Finding ' + song + '…'; w.document.body.style.cssText = 'font:16px Roboto,Arial,sans-serif;padding:24px;color:#6C5C9D'; w.document.body.textContent = 'Finding ' + song + ' on ' + PLATFORMS[p] + '…'; } catch (e) {} }
  else toast('Finding ' + song + '…');
  loadSongLinks(a, p, [song]).then(function () {
    var u = songUrl(a, song, p) || songSearchUrl(a, song, p);
    if (w && !w.closed) { try { w.location.replace(u); return; } catch (e) { try { w.close(); } catch (e2) {} } }
    window.open(u, '_blank', 'noopener');
  });
}

function platformSeg() {
  var p = platformPref();
  return '<div class="seg" id="platSeg">' + [['spotify', 'Spotify'], ['apple', 'Apple Music']].map(function (o) {
    return '<button class="' + (p === o[0] ? 'on' : '') + '" onclick="setPlatform(\'' + o[0] + '\')">' + o[1] + '</button>';
  }).join('') + '</div><div class="t2" id="platNote" style="margin-top:6px">' + esc(platformNote()) + '</div>';
}
function setPlatform(p) {
  savePlatform(p);
  if (view) show(view);
  var sc = document.getElementById('scrim'), y = sc.scrollTop;
  openProfile(); sc.scrollTop = y;
}

/* ---------- seasons ---------- */

function seasonNames() { return (D.seasons || []).map(function (s) { return s.name; }); }
function seasonObj(name) { return (D.seasons || []).filter(function (s) { return s.name === name; })[0] || null; }
function isAll() { return seasonSel === 'all'; }
function seasonLabel() { return isAll() ? 'All seasons' : seasonSel; }
/* Albums in the season picked in the header dropdown. */
function sAlbums() { return isAll() ? D.albums : D.albums.filter(function (a) { return a.season === seasonSel; }); }
function prevSeason(name) { var n = seasonNames(), i = n.indexOf(name); return i > 0 ? n[i - 1] : null; }
/* "Jul 16 to Nov 5" or "Nov 12 onward". A season ends the Thursday before the next one starts. */
function seasonRange(name) {
  var n = seasonNames(), i = n.indexOf(name), s = seasonObj(name);
  if (!s) return '';
  var next = n[i + 1] ? seasonObj(n[i + 1]) : null;
  if (!next) return fmtDate(s.start) + ' onward';
  var p = next.start.split('-'), end = new Date(+p[0], +p[1] - 1, +p[2] - 7);
  var endYmd = end.getFullYear() + '-' + ('0' + (end.getMonth() + 1)).slice(-2) + '-' + ('0' + end.getDate()).slice(-2);
  return fmtDate(s.start) + ' to ' + fmtDate(endYmd);
}
function rankList(list) {
  return list.filter(function (a) { return a.avg != null; }).sort(function (x, y) {
    return (y.avg - x.avg) || (y.count - x.count) || (x.row - y.row);
  });
}
function buildRanks() {
  seasonRanks = {};
  seasonNames().forEach(function (n) { seasonRanks[n] = rankList(D.albums.filter(function (a) { return a.season === n; })); });
  ranked = isAll() ? rankList(D.albums) : (seasonRanks[seasonSel] || []);
}
function renderSeasonSelect() {
  var sel = document.getElementById('season');
  var h = '';
  seasonNames().slice().reverse().forEach(function (n) {
    h += '<option value="' + esc(n) + '"' + (n === seasonSel ? ' selected' : '') + '>' + esc(n) + (n === D.currentSeason ? ' (now)' : '') + '</option>';
  });
  h += '<option value="all"' + (isAll() ? ' selected' : '') + '>All seasons</option>';
  sel.innerHTML = h;
}
function pickSeason(v) {
  seasonSel = v;
  seasonPicked = true;
  buildRanks();
  renderSeasonSelect();
  show(view);
}
/* Segmented buttons at the top of Albums, Members and Stats (same choice as the header dropdown). */
function seasonBar(extra) {
  var h = '<div class="sbar"><div><div class="eyebrow">Showing</div><div class="t1">' + esc(seasonLabel()) + '</div>' +
    '<div class="t2">' + (isAll() ? D.albums.length + ' albums across ' + seasonNames().length + ' seasons' : esc(seasonRange(seasonSel)) + ' · ' + sAlbums().length + (sAlbums().length === 1 ? ' album' : ' albums')) +
    (extra ? ' · ' + extra : '') + '</div></div><div class="seg">';
  seasonNames().forEach(function (n) {
    h += '<button class="' + (n === seasonSel ? 'on' : '') + '" onclick="pickSeason(\'' + jsq(n) + '\')">' + esc(n) + (n === D.currentSeason ? '<span class="now">Now</span>' : '') + '</button>';
  });
  return h + '<button class="' + (isAll() ? 'on' : '') + '" onclick="pickSeason(\'all\')">All</button></div></div>';
}
/* Shown when the chosen season has nothing yet. */
function emptySeason(name) {
  var s = seasonObj(name), first = D.slots.filter(function (x) { return x.season === name; })[0];
  return '<div class="card empty-season"><div class="t1">Nothing picked for ' + esc(name) + ' yet</div>' +
    '<div class="t2">' + (s && s.start > D.today ? 'It kicks off ' + esc(fmtDate(s.start, true)) + '. ' : '') +
    (first && first.turn ? first.turn + ' is up first.' : '') + '</div></div>';
}

function prep(data) {
  D = data;
  syncPlatform(data);
  storeSet('ad.data', JSON.stringify(data));
  D.slots = D.slots || [];
  if (!D.seasons || !D.seasons.length) D.seasons = [{ name: D.season || 'Season 1', start: '', count: D.albums.length }];
  D.albums.forEach(function (a) { if (!a.season) a.season = D.seasons[D.seasons.length - 1].name; });
  // A saved copy can be from last week: never let "today" go backwards from the phone's own date.
  if (!D.today || localToday() > D.today) D.today = localToday();
  D.currentSeason = seasonOfDate(D.today) || D.currentSeason || D.seasons[D.seasons.length - 1].name;
  // The app always opens on the active season. A season picked in the dropdown sticks until the app is closed.
  if (!seasonPicked || (!isAll() && seasonNames().indexOf(seasonSel) < 0)) seasonSel = D.currentSeason;
  buildRanks();
  renderSeasonSelect();
  D.me = D.me || { email: '', name: '' };
  rateState.member = D.members.indexOf(D.me.name) >= 0 ? D.me.name : null;
  var av = document.getElementById('avatar');
  av.style.display = 'flex';
  av.className = 'avatar' + (rateState.member ? '' : ' guest');
  av.style.background = rateState.member ? color(rateState.member) : '';
  var pic = rateState.member && AVATARS[rateState.member];
  if (pic) av.innerHTML = '<img src="' + esc(pic) + '" alt="" onerror="this.parentNode.textContent=\'' + jsq(rateState.member.charAt(0)) + '\'">';
  else av.textContent = rateState.member ? rateState.member.charAt(0) : '?';
  av.title = rateState.member ? rateState.member + ' · ' + D.me.email : 'Not signed in as a member';
}

/* Shown on Rate and Add Album when this Google account isn't one of the members. */
function notMember() {
  return '<div class="card"><div class="eyebrow">Not on the club list</div><h2 style="margin:6px 0 8px">Who\'s this?</h2>' +
    '<div class="muted">' + (D.me.email ? 'You\'re signed in to Google as <b>' + esc(D.me.email) + '</b>, which isn\'t linked to a member.'
      : 'The site couldn\'t tell which Google account you\'re using.') +
    ' Sign out from your profile and sign in again, or ask Jonathan to check the member list.</div></div>';
}

function thisWeek() {
  var past = D.albums.filter(function (a) { return a.date && a.date <= D.today; });
  if (!past.length) return D.albums[D.albums.length - 1] || null;
  return past.reduce(function (best, a) { return a.date > best.date ? a : best; });
}

/* Albums already lined up for a future Thursday, soonest first. */
function upcoming() {
  return D.albums.filter(function (a) { return a.date && a.date > D.today; }).sort(function (x, y) { return x.date < y.date ? -1 : 1; });
}
/* This member's next open Thursday in the rotation. */
function slotFor(m) {
  return D.slots.filter(function (s) { return s.turn === m; })[0] || null;
}
/* This member's own pick that's lined up and still unrated (can be changed). */
function myPending(m) {
  return D.albums.filter(function (a) { return a.pickedBy === m && a.count === 0 && a.date && a.date >= D.today; })
    .sort(function (x, y) { return x.date < y.date ? -1 : 1; })[0] || null;
}
/* True when this date is the very first Thursday of a season after the first. */
function isKickoff(date) {
  var n = seasonNames();
  return n.some(function (name, i) { return i > 0 && seasonObj(name).start === date; });
}
function seasonOfDate(date) {
  var name = seasonNames()[0];
  (D.seasons || []).forEach(function (s) { if (date && s.start && date >= s.start) name = s.name; });
  return name;
}

/* What a member still owes on an album: a score, song picks, a comment. */
function missingFor(a, m) {
  var out = [];
  if (a.ratings[m] == null) out.push('score');
  if (!a.fav[m] || !a.least[m]) out.push('songs');
  if (!a.comments[m]) out.push('comment');
  return out;
}

/* ---------- views ---------- */

var BOARD_TOP = 10, boardAll = false;

/* This week's open Thursday: on or before today, later than the newest album, and nobody has picked for it yet. */
function waitingSlot() {
  var past = D.albums.filter(function (a) { return a.date && a.date <= D.today; }).map(function (a) { return a.date; }).sort();
  var last = past[past.length - 1] || '';
  return D.slots.filter(function (s) { return s.date && s.date <= D.today && s.date > last; })
    .sort(function (x, y) { return x.date < y.date ? 1 : -1; })[0] || null;
}
/* Home hero while this week's album hasn't been picked. */
function waitingHero(s) {
  var who = s.reserved || s.turn, me = !!who && who === rateState.member, kick = isKickoff(s.date);
  var sub = me ? 'Your pick ' + (kick ? 'starts ' + esc(s.season) + '.' : 'is this week\'s album.')
    : 'No album picked yet.';
  return '<div class="card hero waiting" style="--glow:' + (who ? hexRgb(color(who, true)) : '108 92 157') + '"><div class="hart">' +
    (who ? face(who, 'wface') : '<div class="cover"></div>') + '</div><div>' +
    '<div class="eyebrow">This week\'s pick · ' + esc(fmtDate(s.date, true)) + '</div>' +
    (kick ? '<div class="wkick"><span class="kickoff">' + esc(s.season) + ' kicks off</span></div>' : '') +
    '<h2>' + (me ? 'You\'re up!' : who ? 'Waiting on ' + esc(who) : 'No album picked yet') + '</h2>' +
    '<div class="by">' + sub + '</div>' +
    (me ? '<div class="listen"><button class="btn primary" onclick="show(\'add\')">Pick your album</button></div>' : '') +
    waitAlbumBox() + '</div></div>';
}
/* "While you wait" stand in album from the sheet's script (AD_WAIT_ALBUM). Listen only. */
function waitAlbumBox() {
  var w = D.waitAlbum; if (!w || !w.album) return '';
  var p = platformPref() || 'spotify', u = albumUrl(w, p);
  var name = u ? '<a class="alblink" href="' + esc(u) + '" target="_blank" rel="noopener" title="' + esc('Listen on ' + PLATFORMS[p]) + '">' + esc(w.album) + '</a>' : esc(w.album);
  var by = w.artist ? '<a class="artlink" href="' + esc(artistUrl(w, p)) + '" target="_blank" rel="noopener">' + esc(w.artist) + '</a>' : '';
  return '<div class="wwait">' + img(w, 'thumb') + '<div><div class="eyebrow">While you wait</div><div class="t1">' + name + '</div>' +
    '<div class="t2">' + by + (w.year ? ' · ' + esc(w.year) : '') + '</div></div></div>';
}
/* Small card for last week's album while this week's is still open, so people can finish rating it. */
function lastWeekCard(a) {
  var m = rateState.member, owe = m && a.ratings[m] == null;
  return '<div class="card next tap" onclick="openAlbum(' + a.row + ')">' + img(a, 'thumb') + '<div><div class="eyebrow">Last week · ' + esc(fmtDate(a.date, true)) + '</div>' +
    '<div class="t1">' + esc(a.album) + '</div><div class="t2">' + esc(a.artist) + ' · ' +
    (owe ? 'you haven\'t rated it yet' : a.count + ' of ' + D.members.length + ' rated') + '</div></div><span class="chev">›</span></div>';
}

function renderHome() {
  var wait = waitingSlot();
  if (wait) {
    var prev = thisWeek();
    return installCard() + waitingHero(wait) + nextCard() + (prev && prev.date && prev.date <= D.today ? lastWeekCard(prev) : '') + homeBoard();
  }
  var a = thisWeek();
  if (!a) return '<div class="card">No albums yet.</div>' + nextCard();
  var mine = rateState.member ? a.ratings[rateState.member] : null;
  var glow = (ART && a.cover && ART[a.cover]) || hexRgb(color(a.pickedBy, true));
  var h = installCard() + '<div class="card hero" data-row="' + a.row + '" style="--glow:' + glow + '"><div class="hart">' +
    (a.cover ? '<img class="amb" src="' + esc(a.cover) + '" alt="" aria-hidden="true">' : '') + img(a, 'cover') + '</div><div>' +
    '<div class="htop"><div><div class="eyebrow">This week\'s pick · ' + esc(fmtDate(a.date, true)) + '</div>' +
    '<h2>' + albumLink(a) + '</h2><div class="by">' + artistLink(a) + (a.year ? ' · ' + esc(a.year) : '') + '</div></div></div>' +
    (a.avg == null ? '' : '<div class="bigavg"><b>' + cnt(a.avg) + '</b><span class="stars">' + stars(a.avg) + '</span><small>group avg</small></div>') +
    '<div class="meta">' + face(a.pickedBy, 'mini') + '<span><b>' + esc(a.pickedBy) + '\'s pick</b> · ' + esc(a.season) + ', #' + a.number + '</span></div>' +
    // Everyone's photo: full color once they've rated, faded until they do.
    '<div class="faces"><div class="row5">' + D.members.map(function (m) {
      var done = a.ratings[m] != null;
      return '<span title="' + esc(m + (done ? ' has rated it' : ' hasn\'t rated yet')) + '">' + face(m, 'mini' + (done ? '' : ' off')) + '</span>';
    }).join('') + '</div><span class="t2">' + (a.count === D.members.length ? 'Everyone has rated this one' : a.count + ' of ' + D.members.length + ' rated') + '</span></div>' +
    '<div class="listen"><button class="btn primary' + (mine != null ? ' mine' : '') + '" onclick="goRate(' + a.row + ')">' +
      (mine != null ? 'Your score: ' + num(mine) + '<span class="yours">· Edit</span>' : 'Rate it') + '</button></div>' +
    '</div></div>';

  return h + nextCard() + homeBoard();
}

/* Home leaderboard for the season picked in the header. */
function homeBoard() {
  var h = '<div class="section-title">' + esc(seasonLabel()) + ' leaderboard</div>';
  if (!ranked.length) {
    var prev = !isAll() && prevSeason(seasonSel), champ = prev && (seasonRanks[prev] || [])[0];
    h += '<div class="card empty-season"><div class="t1">No ratings in ' + esc(seasonLabel()) + ' yet</div>' +
      '<div class="t2">' + (seasonObj(seasonSel) && seasonObj(seasonSel).start > D.today ? 'It kicks off ' + esc(fmtDate(seasonObj(seasonSel).start, true)) + '.' : 'The board fills in as albums get rated.') + '</div></div>';
    if (champ) {
      h += statCard(prev + ' champion', 'var(--gold)', champ, fmt(champ.avg) + ' <span class="stars">' + stars(champ.avg) + '</span> · picked by ' + esc(champ.pickedBy)) +
        '<div style="text-align:center"><button class="btn ghost" onclick="pickSeason(\'' + jsq(prev) + '\')">See the ' + esc(prev) + ' standings</button></div>';
    }
    return h;
  }
  var live = isRanking(ranked);
  var shown = boardAll || ranked.length <= BOARD_TOP ? ranked : ranked.slice(0, BOARD_TOP);
  h += '<div class="card">' + (live ? '' : '<div class="t2 board-wait">Rankings start once ' + MIN_RANKED + ' albums are rated.</div>') + '<ol class="board' + (live ? '' : ' unranked') + '">';
  shown.forEach(function (x, i) {
    // One line each for album and artist; long names end in "…" (full name in the popup).
    h += '<li class="' + (live && i < 3 ? 'm' + (i + 1) : '') + '" onclick="openAlbum(' + x.row + ')" title="' + esc(x.album + ' · ' + x.artist) + '"><div class="rank">' + (live ? i + 1 : '–') + '</div>' + img(x, 'thumb') +
      '<div class="binfo"><div class="t1">' + esc(x.album) + '</div><div class="t2 bline">' + artistLink(x, 'art') + '<span class="bw dot">·</span>' + face(x.pickedBy, 'tiny') + '<span class="bw pname">' + esc(x.pickedBy) + '</span>' +
      (isAll() ? '<span class="stag">' + esc(x.season) + '</span>' : '') + '</div></div>' +
      '<div class="score"><b>' + cnt(x.avg) + '</b><span class="stars">' + stars(x.avg) + '</span></div></li>';
  });
  h += '</ol>';
  if (ranked.length > BOARD_TOP) h += '<div class="board-more"><button class="linkish" onclick="boardAll=!boardAll;show(\'home\')">' +
    (boardAll ? 'Show top ' + BOARD_TOP : 'Show all ' + ranked.length) + '</button></div>';
  return h + '</div>';
}

/* Home strip: only when next Thursday's album is already locked in.
   If the very next week is still open (even if a later week is picked), show nothing. */
function nextCard() {
  var n = upcoming()[0];
  if (!n) return '';
  var open = D.slots.filter(function (s) { return s.date && s.date > D.today; })[0];
  if (open && open.date < n.date) return '';
  var label = isKickoff(n.date) ? '<span class="kickoff">' + esc(seasonOfDate(n.date)) + ' kicks off</span> · ' + esc(fmtDate(n.date, true)) : 'Up next · ' + esc(fmtDate(n.date, true));
  return '<div class="card next tap" onclick="openAlbum(' + n.row + ')">' + img(n, 'thumb') + '<div><div class="eyebrow">' + label + '</div>' +
    '<div class="t1">' + esc(n.album) + '</div><div class="t2">' + artistLink(n) + (n.year ? ' · ' + esc(n.year) : '') + ' · picked by ' + esc(n.pickedBy) + '</div></div>' +
    '<span class="chev">›</span></div>';
}

/* Loads the saved score, songs and comment for the chosen member and album. */
function loadMine() {
  var a = albumByRow(rateState.row), m = rateState.member;
  if (!a || !m) { rateState.fav = ''; rateState.least = ''; rateState.comment = ''; return; }
  if (a.ratings[m] != null) rateState.score = a.ratings[m];
  rateState.fav = a.fav[m] || '';
  rateState.least = a.least[m] || '';
  rateState.comment = a.comments[m] || '';
}

function songSelect(id, a, current, label) {
  var list = (a && a.tracks) ? a.tracks.slice() : [];
  if (current && list.indexOf(current) < 0) list.unshift(current);
  var h = '<select id="' + id + '" onchange="rateState.' + id + '=this.value">' +
    '<option value="">' + (list.length ? label : 'Tracklist not loaded yet') + '</option>';
  list.forEach(function (s, i) {
    h += '<option value="' + esc(s) + '"' + (s === current ? ' selected' : '') + '>' + (i + 1) + '. ' + esc(s) + '</option>';
  });
  return h + '</select>';
}

function renderRate() {
  if (!rateState.row) { var w = thisWeek(); rateState.row = w ? w.row : null; loadMine(); }
  var a = albumByRow(rateState.row);
  var max = D.commentMax || 200;
  var already = a && rateState.member && a.ratings[rateState.member] != null;

  if (!rateState.member) return notMember();
  var h = '<div class="card">';
  h += '<div class="eyebrow" style="margin-bottom:8px">Rating as ' + chip(rateState.member) + '</div><select id="albumSel" onchange="pickAlbum(this.value)">';
  // Every album you can rate, grouped by season (newest season first).
  seasonNames().slice().reverse().forEach(function (sn) {
    var list = D.albums.filter(function (x) { return x.season === sn && !(x.date && x.date > D.today && x.row !== rateState.row); }).reverse();
    if (!list.length) return;
    h += '<optgroup label="' + esc(sn) + '">';
    list.forEach(function (x) {
      h += '<option value="' + x.row + '"' + (x.row === rateState.row ? ' selected' : '') + '>' + esc(x.album + ' · ' + x.artist) + '</option>';
    });
    h += '</optgroup>';
  });
  h += '</select>';

  // Cover on the left; title, artist, picker and your score beside it (keeps the page short).
  var score = '<div class="slider"><div class="big" id="scoreBig">' + num(rateState.score) + '</div><span class="stars" id="scoreStars">' + stars(rateState.score) + '</span></div>';
  if (a) h += '<div class="ratehead">' + img(a, 'cover') + '<div class="rh-info">' +
    '<div class="rc-t">' + albumLink(a) + '</div><div class="rc-a">' + artistLink(a, 'rc-art') + '' +
    (a.pickedBy ? '<span class="rc-by">' + face(a.pickedBy, 'tiny') + esc(a.pickedBy) + '</span>' : '') + '</div>' +
    score + '</div></div>';
  else h += score;
  h +=
    '<input type="range" min="1" max="10" step="0.25" value="' + rateState.score + '" oninput="slide(this.value)">' +
    '<div class="scale"><span>1</span><span>5.5</span><span>10</span></div>';

  h += '<div class="extras">' +
    '<div class="two">' +
      '<div class="field"><label>♥ Favorite song</label>' + songSelect('fav', a, rateState.fav, 'Pick your favorite') + '</div>' +
      '<div class="field"><label>✕ Least favorite song</label>' + songSelect('least', a, rateState.least, 'Pick your least favorite') + '</div>' +
    '</div>' +
    '<div class="field"><label>Your take</label>' +
      '<textarea id="comment" maxlength="' + max + '" placeholder="A sentence or two. One comment gets featured each day." oninput="typed(this.value)">' + esc(rateState.comment) + '</textarea>' +
      '<div class="hint"><span>Optional</span><span id="count">' + rateState.comment.length + ' / ' + max + '</span></div></div>' +
    '</div>';

  h += '<div style="margin-top:16px"><button class="btn primary" style="width:100%;padding:14px;font-size:16px" id="saveBtn" onclick="save()">' +
    (already ? 'Update my rating' : 'Submit rating') + '</button></div>' +
    '<div class="msg" id="msg"></div>';

  return h + '</div>';
}

/* ---------- add album (New Album Thursday) ---------- */

function seasonTag(date) {
  var s = seasonOfDate(date);
  return s !== D.currentSeason || isKickoff(date) ? ' · ' + esc(s) : '';
}

function renderAdd() {
  var m = rateState.member;
  if (!m) return notMember() + queueCard();
  var h = '<div class="card">';

  var pending = myPending(m);
  var changing = addState.changeRow != null;
  var lockedOut = pending && pending.date > D.today && !changing;
  var slot = changing ? { row: addState.changeRow, date: (albumByRow(addState.changeRow) || {}).date } : slotFor(m);

  if (addState.flash) {
    h += '<div class="msg ok" style="margin-top:0">' + addState.flash + '</div>';
    addState.flash = null;
  }

  // Today's own pick, still unrated: it can still be swapped or removed on the day
  // (say everyone has already heard it). Shown above the form for the next turn.
  var todays = !changing && D.albums.filter(function (a) { return a.pickedBy === m && a.count === 0 && a.date === D.today; })[0];
  if (todays) {
    h += '<div class="eyebrow">Today\'s album' + seasonTag(todays.date) + '</div>' +
      '<div class="pending">' + img(todays, 'thumb') + '<div class="pinfo"><div class="t1">' + esc(todays.album) + '</div><div class="t2">' + esc(todays.artist) + (todays.year ? ' · ' + esc(todays.year) : '') + '</div></div></div>' +
      '<div class="pactions"><button class="btn ghost" onclick="startChange(' + todays.row + ')">Change album</button>' +
      '<button class="btn danger" onclick="confirmRemove(' + todays.row + ')">Remove</button></div>' +
      '<div class="phint">Everyone already heard it? Swap it out. You can change or remove it until someone rates it.</div></div>';
    return h + queueCard();
  }

  if (lockedOut) {
    h += '<div class="eyebrow">Your pick for ' + esc(fmtDate(pending.date, true)) + seasonTag(pending.date) + '</div>' +
      '<div class="pending">' + img(pending, 'thumb') + '<div class="pinfo"><div class="t1">' + esc(pending.album) + '</div><div class="t2">' + esc(pending.artist) + (pending.year ? ' · ' + esc(pending.year) : '') + '</div></div></div>' +
      '<div class="pactions"><button class="btn ghost" onclick="startChange(' + pending.row + ')">Change album</button>' +
      '<button class="btn danger" onclick="confirmRemove(' + pending.row + ')">Remove</button></div>' +
      '<div class="phint">You can change or remove it until someone rates it.</div></div>';
    return h + queueCard();
  }
  if (!slot) return h + '<div class="note warn">' + (D.slots.length ? 'You don\'t have another turn coming up in the open weeks on the sheet yet.' : 'Every row on the sheet is filled. Ask Jonathan to add more rows.') + '</div></div>' + queueCard();

  h += '<div class="eyebrow">' + (changing ? 'Change your pick for ' : 'Your turn: ') + esc(fmtDate(slot.date, true)) + seasonTag(slot.date) + '</div>';
  if (!changing) {
    var first = D.slots[0];
    if (first && first.row === slot.row) h += '<div class="note">You\'re up next.' + (isKickoff(slot.date) ? ' Yours is the first album of ' + esc(seasonOfDate(slot.date)) + '!' : '') + '</div>';
    else if (first) {
      var before = D.slots[D.slots.indexOf(slot) - 1] || first;
      h += '<div class="note">' + esc(fmtDate(before.date, true)) + ' is ' + (before.turn ? chip(before.turn) + '\'s turn' : 'open') + ', so yours is ' + esc(fmtDate(slot.date)) + '.</div>';
    }
  }

  if (addState.picked) {
    var p = addState.picked;
    h += '<div class="chosen" style="margin-top:14px">' + (p.cover ? '<img class="cover" src="' + esc(p.cover) + '" alt="">' : '<div class="cover"></div>') +
      '<div class="fields">' +
        '<div class="field"><label>Album</label><input type="text" id="pAlbum" value="' + esc(p.album) + '" oninput="addState.picked.album=this.value" maxlength="150"></div>' +
        '<div class="field"><label>Artist</label><input type="text" id="pArtist" value="' + esc(p.artist) + '" oninput="addState.picked.artist=this.value" maxlength="150"></div>' +
        '<div class="field"><label>Year</label><input type="number" id="pYear" value="' + esc(p.year) + '" oninput="addState.picked.year=this.value" min="1900" max="2030" inputmode="numeric"></div>' +
        (p.kind && p.kind !== 'Album' ? '<div class="note warn">Heads up: Apple lists this as a' + (p.kind === 'EP' ? 'n EP' : ' single') + ', not a full album.</div>' : '') +
        (/\b(deluxe|remaster|edition|anniversary|expanded)\b/i.test(p.album) ? '<div class="t2">Tip: you can trim words like "Deluxe Edition" so the name matches the original album.</div>' : '') +
      '</div></div>' +
      '<div style="margin-top:16px;display:grid;gap:8px">' +
        '<button class="btn primary" style="width:100%;padding:14px;font-size:16px" id="pickBtn" onclick="savePick()">' +
          (changing ? 'Swap in this album' : 'Lock it in for ' + esc(fmtDate(slot.date))) + '</button>' +
        '<button class="linkish" style="justify-self:center" onclick="addState.picked=null;show(\'add\')">Pick a different album</button>' +
      '</div>';
  } else {
    h += '<div class="searchrow" style="margin-top:14px"><input type="search" id="q" placeholder="Search an album or artist" value="' + esc(addState.query) + '" onkeydown="if(event.key===\'Enter\')runSearch()" autocomplete="off">' +
      '<button class="btn primary" onclick="runSearch()"' + (addState.searching ? ' disabled' : '') + '>' + (addState.searching ? 'Searching…' : 'Search') + '</button></div>';
    if (addState.results) {
      if (!addState.results.length) h += '<div class="note">No matches. Try adding the artist name, or type it in yourself below.</div>';
      else {
        h += '<div class="results">';
        addState.results.forEach(function (r, i) {
          var taken = alreadyPicked(r.album, r.artist);
          h += '<button class="res" onclick="choose(' + i + ')">' + (r.cover ? '<img class="cover" src="' + esc(r.cover) + '" alt="">' : '<div class="cover"></div>') +
            '<div class="info"><div class="t1">' + esc(r.album) + '</div><div class="t2">' + esc(r.artist) + (r.year ? ' · ' + esc(r.year) : '') + '</div>' +
            (taken ? '<span class="tag warn">Picked in ' + esc(taken.season) + '</span>' : '<span class="tag">' + esc(r.kind) + (r.tracks ? ' · ' + r.tracks + (r.tracks === 1 ? ' song' : ' songs') : '') + '</span>') + '</div></button>';
        });
        h += '</div>';
      }
    }
    h += '<div style="margin-top:12px"><button class="linkish" onclick="manual()">Can\'t find it? Type it in yourself</button></div>';
  }
  if (changing) h += '<div style="margin-top:10px"><button class="linkish" onclick="addState.changeRow=null;addState.picked=null;show(\'add\')">Keep my current pick</button></div>';
  h += '<div class="msg" id="addMsg"></div></div>';
  return h + queueCard();
}

/* Coming up: lined up albums plus the next few open Thursdays, with a marker where a new season starts. */
function queueCard() {
  var rows = upcoming().map(function (a) { return { date: a.date, a: a }; })
    .concat(D.slots.slice(0, 5).map(function (s) { return { date: s.date, s: s }; }))
    .sort(function (x, y) { return x.date < y.date ? -1 : 1; }).slice(0, 5);
  if (!rows.length) return '';
  var h = '<div class="section-title">Coming up</div><div class="card"><ul class="queue">';
  rows.forEach(function (r) {
    if (isKickoff(r.date)) h += '<li class="divider"><span>' + esc(seasonOfDate(r.date)) + ' starts</span></li>';
    var d = '<div class="d">' + esc(fmtDate(r.date)) + '</div>';
    if (r.a) h += '<li class="tap" onclick="openAlbum(' + r.a.row + ')">' + d + img(r.a, 'thumb') + '<div><div class="t1">' + esc(r.a.album) + '</div><div class="t2">' + esc(r.a.artist) + '</div></div>' + chip(r.a.pickedBy) + '</li>';
    else h += '<li>' + d + '<div class="thumb"></div><div class="open">No album yet</div>' + (r.s.turn ? chip(r.s.turn) : '<span></span>') + '</li>';
  });
  return h + '</ul></div>';
}

/* The album already on the list with this name and artist (any season), or null. */
function alreadyPicked(album, artist) {
  var n = function (s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim(); };
  return D.albums.filter(function (a) { return a.row !== addState.changeRow && n(a.album) === n(album) && n(a.artist) === n(artist); })[0] || null;
}

/* Cards in the order given. The current week's album gets a "This week" tag. */
function albumCards(list) {
  var h = '<div class="grid">', cur = thisWeek();
  list.forEach(function (a) {
    var soon = a.date && a.date > D.today;
    var now = !soon && a === cur;
    h += '<div class="gcard ' + medalClass(a) + '" onclick="openAlbum(' + a.row + ')">' + img(a, 'cover') +
      '<div class="info">' + (now ? '<div class="nowtag">This week</div>' : '') + '<div class="t1">' + esc(a.album) + '</div><div class="t2">' + artistLink(a) + '</div>' +
      '<div class="t2" style="margin-top:4px">' + (soon ? 'Coming ' + esc(fmtDate(a.date)) + ' · ' + esc(a.pickedBy) : a.avg == null ? 'Not rated yet' : '<span class="stars">' + stars(a.avg) + '</span> ' + fmt(a.avg)) + '</div></div></div>';
  });
  return h + '</div>';
}
function isSoon(a) { return !!(a.date && a.date > D.today); }

function renderAlbums() {
  var h = seasonBar();
  var names = isAll() ? seasonNames().slice().reverse() : [seasonSel];
  /* Top: albums we're on now or have listened to, newest first (this week's leads).
     Bottom: albums lined up for future Thursdays, soonest first. */
  var later = upcoming().filter(function (a) { return isAll() || a.season === seasonSel; });
  var any = false;
  names.forEach(function (n) {
    var all = D.albums.filter(function (a) { return a.season === n; });
    var heard = all.filter(function (a) { return !isSoon(a); }).reverse();
    if (!heard.length) { if (!all.length) h += emptySeason(n); return; }
    any = true;
    h += '<div class="shead"><div class="section-title">' + (isAll() ? esc(n) : 'Listened') + '</div><div class="t2">' +
      (isAll() ? esc(seasonRange(n)) + ' · ' : '') + heard.length + (heard.length === 1 ? ' album' : ' albums') + '</div></div>';
    h += albumCards(heard);
  });
  if (!any && later.length) h += '<div class="card empty-season"><div class="t1">Nothing listened to yet</div><div class="t2">The first album is below.</div></div>';
  if (later.length) {
    h += '<div class="shead upnext"><div class="section-title">Upcoming</div><div class="t2">' + later.length + (later.length === 1 ? ' album' : ' albums') + ' lined up</div></div>';
    h += albumCards(later);
  }
  return h;
}

function renderMembers() {
  /* Members always covers every album; seasons don't apply here. */
  var list = D.albums;
  var due = list.filter(function (a) { return !a.date || a.date <= D.today; });
  var pairs = pairStats(list);
  var h = '<div class="mgrid">';
  /* The signed in member's card comes first; everyone else keeps the usual order. */
  var me = rateState.member;
  var order = me ? [me].concat(D.members.filter(function (m) { return m !== me; })) : D.members;
  order.forEach(function (m) {
    var picks = list.filter(function (a) { return a.pickedBy === m; });
    var pickAvg = avgOf(picks.map(function (a) { return a.avg; }));
    var given = list.map(function (a) { return a.ratings[m]; }).filter(function (v) { return v != null; });
    var owed = due.filter(function (a) { return a.ratings[m] == null; });
    var said = due.filter(function (a) { return a.comments[m]; }).length;
    var mine = pairs.filter(function (p) { return p.a === m || p.b === m; }).sort(function (x, y) { return x.gap - y.gap; })[0];
    var fav = list.filter(function (a) { return a.ratings[m] != null; }).sort(function (x, y) { return y.ratings[m] - x.ratings[m]; })[0];
    h += '<div class="card mcard" style="border-top:8px solid ' + color(m) + '"><h3>' + face(m, 'mini') + esc(m) + (m === rateState.member ? '<span class="you">You</span>' : '') + '</h3>' +
      kv('Picks', picks.length) +
      kv('Avg score of their picks', pickAvg == null ? 'No ratings yet' : fmt(pickAvg) + ' <span class="stars">' + stars(pickAvg) + '</span>') +
      kv('Avg rating they give', given.length ? fmt(avgOf(given)) : 'Hasn\'t rated yet') +
      kv('Albums rated', given.length + ' of ' + due.length) +
      kv('Comments left', said + ' of ' + due.length) +
      kv('Favorite', fav ? esc(fav.album) + ' (' + num(fav.ratings[m]) + ')' : 'None yet') +
      kv('Taste twin', mine ? esc(mine.a === m ? mine.b : mine.a) + ' (' + mine.gap.toFixed(1) + ' apart)' : 'Not enough shared ratings') +
      (owed.length ? '<div class="todo muted">Still to rate: ' + owed.map(function (a) { return esc(a.album); }).join(', ') + '</div>' : '') +
      '</div>';
  });
  return h + '</div>';
}

function renderStats() {
  var list = sAlbums();
  var live = isAll() || seasonSel === D.currentSeason;
  var h = seasonBar();
  if (!ranked.length) return h + (list.length ? '<div class="card empty-season"><div class="t1">No ratings in ' + esc(seasonLabel()) + ' yet</div><div class="t2">Stats show up once albums get rated.</div></div>' : emptySeason(seasonSel));
  h += '<div class="mgrid">';
  if (!isRanking(ranked)) h += '<div class="card empty-season"><div class="t1">Top rated and most hated show up once ' + MIN_RANKED + ' albums are rated</div><div class="t2">' + ranked.length + ' rated in ' + esc(seasonLabel()) + ' so far.</div></div>';
  else h += statCard(isAll() ? 'Top rated ever' : live ? 'Top rated so far' : 'Album of the season', 'var(--plum-text)', ranked[0], fmt(ranked[0].avg) + ' <span class="stars">' + stars(ranked[0].avg) + '</span> · picked by ' + esc(ranked[0].pickedBy) + (isAll() ? ' · ' + esc(ranked[0].season) : ''));
  var worst = isRanking(ranked) && ranked.slice().sort(function (x, y) { return (x.avg - y.avg) || (y.count - x.count) || (x.row - y.row); })[0];
  if (worst) h += statCard(isAll() ? 'Most hated ever' : live ? 'Most hated so far' : 'Biggest flop', 'var(--red)', worst, fmt(worst.avg) + ' <span class="stars">' + stars(worst.avg) + '</span> · picked by ' + esc(worst.pickedBy) + (isAll() ? ' · ' + esc(worst.season) : ''));
  var div = list.filter(function (a) { return a.count >= 2; }).map(function (a) {
    var v = vals(a); return { a: a, spread: Math.max.apply(null, v) - Math.min.apply(null, v), lo: Math.min.apply(null, v), hi: Math.max.apply(null, v) };
  }).sort(function (x, y) { return (y.spread - x.spread) || (x.a.row - y.a.row); })[0];
  if (div) h += statCard('Most divisive', 'var(--plum2)', div.a, 'Ratings ranged ' + num(div.lo) + ' to ' + num(div.hi));

  var take = null;
  list.forEach(function (a) {
    if (a.count < 2) return;
    D.members.forEach(function (m) {
      var v = a.ratings[m]; if (v == null) return;
      var d = Math.abs(v - a.avg);
      if (!take || d > take.d) take = { d: d, m: m, a: a, v: v };
    });
  });
  if (take) h += statCard('Hottest take', 'var(--plum2)', take.a, esc(take.m) + ' rated it ' + num(take.v) + ' (' + (take.v - take.a.avg >= 0 ? '+' : '') + (take.v - take.a.avg).toFixed(1) + ' vs group)');

  var pairs = pairStats(list).sort(function (x, y) { return x.gap - y.gap; });
  if (pairs.length) {
    h += '<div class="card"><div class="stat"><div></div><div><div class="lbl" style="color:var(--plum2)">Taste twins</div><div class="t1" style="font-size:18px;margin:4px 0">' + chip(pairs[0].a) + chip(pairs[0].b) + '</div><div class="t2">Ratings differ by ' + pairs[0].gap.toFixed(1) + ' on average</div></div></div></div>';
    var far = pairs[pairs.length - 1];
    h += '<div class="card"><div class="stat"><div></div><div><div class="lbl" style="color:var(--plum2)">Least in sync</div><div class="t1" style="font-size:18px;margin:4px 0">' + chip(far.a) + chip(far.b) + '</div><div class="t2">Ratings differ by ' + far.gap.toFixed(1) + ' on average</div></div></div></div>';
  }
  h += '</div>';

  h += '<div class="section-title">Toughest critics</div><div class="card bars">';
  D.members.map(function (m) {
    return { m: m, v: avgOf(list.map(function (a) { return a.ratings[m]; })) };
  }).sort(function (x, y) { return (x.v == null) - (y.v == null) || x.v - y.v; }).forEach(function (r) {
    h += '<div class="row"><span>' + face(r.m, 'tiny') + esc(r.m) + '</span><div class="track"><div class="fill" style="width:' + (r.v == null ? 0 : r.v * 10) + '%"></div></div><span>' + (r.v == null ? '–' : r.v.toFixed(1)) + '</span></div>';
  });
  h += '<div class="t2" style="margin-top:8px">Average rating each person gives. Shortest bar is the toughest critic.</div></div>';
  return h + procrastinator(list);
}

/* ---------- the Procrastinator ----------
 * How late each member's score came in. Albums drop Thursday and everyone has
 * until the Monday after (GRACE_DAYS) before the clock starts; a score in by then
 * counts as on time (0). Albums a member still hasn't scored count once that
 * Monday has come, and keep growing every day. Rating times
 * are saved by the server (a.ratedAt) starting Nov 10, 2026; older ratings have
 * no time and are left out. The times themselves are never shown. */
var GRACE_DAYS = 4; // Thursday -> Monday
function lateDays(a, t) {
  var p = a.date.split('-');
  var start = new Date(+p[0], +p[1] - 1, +p[2] + GRACE_DAYS).getTime(); // local midnight Monday
  return Math.max(0, (t - start) / 864e5);
}
/* A member's big photo wearing the crying filter. The tears start under that
   member's lower eyelids (FACES, found on their photo by the deploy job); members
   without face points get spots that suit a face centered in the photo. */
var FACE_DEFAULT = { l: [36.5, 45], r: [63.5, 45], ew: 12 };
function tearsSvg(name) {
  var f = FACES[name] || FACE_DEFAULT;
  var k = Math.max(0.6, Math.min(1.8, (f.ew || 12) / 12)); // tear size follows eye size
  var n = function (v) { return Math.round(v * 10) / 10; };
  // side: 1 = eye on the left of the photo (tear drifts left), -1 = right (mirrored)
  var tear = function (x, y, side) {
    var o = function (dx) { return n(x + side * dx * k); };
    var bottom = Math.max(100, y + 30);
    return '<ellipse cx="' + o(-9.5) + '" cy="' + n(y + 13 * k) + '" rx="' + n(9 * k) + '" ry="' + n(4.5 * k) + '" fill="#ff5f86" opacity=".32"/>' +
      '<path d="M' + o(-3.5) + ',' + n(y) + ' C' + o(-8.5) + ',' + n(y + 15 * k) + ' ' + o(0.5) + ',' + n(y + 29 * k) + ' ' + o(-6.5) + ',' + n(bottom) +
      ' L' + o(2.5) + ',' + n(bottom) + ' C' + o(8.5) + ',' + n(y + 29 * k) + ' ' + o(0.5) + ',' + n(y + 15 * k) + ' ' + o(3.5) + ',' + n(y) + ' Z" fill="#8fd3ff" opacity=".88" stroke="#fff" stroke-width="1"/>' +
      '<path class="flow" d="M' + n(x) + ',' + n(y + 1) + ' C' + o(-3.5) + ',' + n(y + 15 * k) + ' ' + o(3.5) + ',' + n(y + 29 * k) + ' ' + o(-2) + ',' + n(bottom) + '" fill="none" stroke="#fff" stroke-width="' + n(1.6 * k) + '" stroke-linecap="round" opacity=".9"/>';
  };
  // where each stream leaves the round photo, for the falling drops
  var exit = function (x, side) {
    var dx = x + side * -2 * k - 50;
    return [n(x + side * -2 * k), n(50 + Math.sqrt(Math.max(0, 2500 - dx * dx)) - 2)];
  };
  var a = exit(f.l[0], 1), b = exit(f.r[0], -1);
  var drop = function (p, cls) {
    return '<path class="drop' + cls + '" d="M' + p[0] + ',' + p[1] + ' c2.5,4 3.5,6 0,9 c-3.5,-3 -2.5,-5 0,-9 Z" fill="#6cc4f7"/>';
  };
  return '<svg viewBox="0 0 100 100" aria-hidden="true"><defs><clipPath id="adTearClip"><circle cx="50" cy="50" r="50"/></clipPath></defs>' +
    '<g clip-path="url(#adTearClip)">' + tear(f.l[0], f.l[1], 1) + tear(f.r[0], f.r[1], -1) + '</g>' +
    drop(a, '') + drop(b, ' d2') + '</svg>';
}
function crying(name) { return '<span class="cry">' + face(name, 'pbig') + tearsSvg(name) + '</span>'; }

function procrastinator(list) {
  var now = Date.now();
  var due = list.filter(function (a) { return a.date && a.date <= D.today; });
  var rows = D.members.map(function (m) {
    var waits = [], owed = [];
    due.forEach(function (a) {
      var at = a.ratedAt && a.ratedAt[m];
      if (a.ratings[m] == null) { var d = lateDays(a, now); if (d > 0) { waits.push(d); owed.push({ a: a, d: d }); } }
      else if (at) waits.push(lateDays(a, at));
    });
    return { m: m, v: avgOf(waits), n: waits.length, owed: owed };
  });
  var h = '<div class="section-title">The Procrastinator</div><div class="card procrast">';
  var counted = rows.filter(function (r) { return r.v != null; });
  if (!counted.length) {
    return h + '<div class="t1">No slackers on record yet</div><div class="t2">Rating times are tracked from Nov 10 on. Rate late and this is where you\'ll end up.</div></div>';
  }
  counted.sort(function (x, y) { return (y.v - x.v) || (y.owed.length - x.owed.length); });
  var worst = counted[0];
  var dd = function (v) { return v < 0.95 ? Math.round(v * 24) + 'h' : v.toFixed(1) + 'd'; };
  // A tie is anyone whose average shows the same as the worst one.
  var tied = counted.filter(function (r) { return dd(r.v) === dd(worst.v); });
  var onTime = function (r) { return r.v != null && dd(r.v) === '0h'; };
  // Nobody is a procrastinator until someone is actually late.
  var anyLate = !onTime(worst);
  var fast = anyLate && counted.length > tied.length && !counted.some(onTime) ? counted[counted.length - 1] : null;
  var names = tied.map(function (r) { return esc(r.m); });
  var nameLine = names.length > 1 ? names.slice(0, -1).join(', ') + ' &amp; ' + names[names.length - 1] : names[0];
  // Short pills under the name instead of a long sentence.
  var pills = '<span class="pill">' + dd(worst.v) + ' late on avg</span>';
  var owing = tied.filter(function (r) { return r.owed.length; });
  if (owing.length === 1 && tied.length === 1) pills += '<span class="pill bad">owes ' + owing[0].owed.length + '</span>';
  else if (owing.length && owing.every(function (r) { return r.owed.length === owing[0].owed.length; }) && owing.length === tied.length)
    pills += '<span class="pill bad">' + (tied.length === 2 ? 'both' : 'all') + ' owe ' + owing[0].owed.length + '</span>';
  else owing.forEach(function (r) { pills += '<span class="pill bad">' + esc(r.m) + ' owes ' + r.owed.length + '</span>'; });

  if (anyLate) {
  h += '<div class="crown"><div class="pwrap' + (tied.length === 2 ? ' duo' : tied.length > 2 ? ' trio' : '') + '">' +
    tied.slice(0, 3).map(function (r) { return crying(r.m); }).join('') + '<span class="snail" aria-hidden="true">🐌</span></div><div style="min-width:0">' +
    '<div class="lbl" style="color:var(--red)">' + (tied.length > 1 ? (isAll() ? 'Tied of all time' : 'Tied for procrastinator') : (isAll() ? 'Procrastinator of all time' : 'Reigning procrastinator')) + '</div>' +
    '<h3>' + nameLine + '</h3><div class="meta">' + pills + '</div></div></div>';

  } else {
    h += '<div class="crown"><div class="pwrap" style="font-size:44px;line-height:1">🎧</div><div><div class="lbl" style="color:var(--gold)">No procrastinator</div><h3>Everyone\'s on time</h3><div class="t2">Everyone rated by the Monday after each album.</div></div></div>';
  }
  var max = Math.max.apply(null, counted.map(function (r) { return r.v; })) || 1;
  h += '<div class="lbl sub first" style="color:var(--muted)">Days late (clock starts Monday)</div><div class="bars">';
  rows.slice().sort(function (x, y) { return (x.v == null) - (y.v == null) || y.v - x.v; }).forEach(function (r) {
    var isFast = fast && r.m === fast.m;
    var tag = r.owed.length ? '<span class="owes">owes ' + r.owed.length + '</span>' : isFast ? '<span class="zap">⚡ fastest</span>' : onTime(r) ? '<span class="zap">on time</span>' : '';
    h += '<div class="row' + (isFast ? ' fast' : '') + '"><span>' + face(r.m, 'tiny') + esc(r.m) + '</span>' +
      '<div class="track"><div class="fill" style="width:' + (r.v == null || onTime(r) ? 0 : Math.max(3, r.v / max * 100)) + '%"></div></div>' +
      '<span class="val">' + tag + (onTime(r) ? '' : '<span>' + (r.v == null ? '–' : dd(r.v)) + '</span>') + '</span></div>';
  });
  h += '</div>';

  // Only once the Tuesday after the album's Thursday has come (a day past the grace Monday) and it's still unrated.
  // One line per album, with everyone who still owes it.
  var byAlbum = {}, shame = [];
  rows.forEach(function (r) { r.owed.forEach(function (o) {
    if (o.d < 1) return;
    var s = byAlbum[o.a.row];
    if (!s) { s = byAlbum[o.a.row] = { a: o.a, d: o.d, ms: [] }; shame.push(s); }
    s.ms.push(r.m);
  }); });
  shame.sort(function (x, y) { return y.d - x.d; });
  if (shame.length) {
    h += '<div class="lbl sub" style="color:var(--red)">Wall of shame</div><ul class="shame">';
    shame.slice(0, 5).forEach(function (s) {
      h += '<li onclick="openAlbum(' + s.a.row + ')"><span class="faces2">' + s.ms.map(function (m) { return face(m, 'tiny'); }).join('') + '</span>' +
        '<span class="al"><b>' + esc(s.a.album) + '</b><small>' + s.ms.map(esc).join(', ') + '</small></span><span class="days">' + Math.floor(s.d) + 'd late</span></li>';
    });
    h += '</ul>';
    if (shame.length > 5) h += '<div class="t2" style="margin-top:4px">+' + (shame.length - 5) + ' more overdue</div>';
  }
  return h + '</div>';
}

/* Every song someone picked as a favorite or least favorite, in track order, with whose pick it was. */

/* Shows the popup from the top and stops the page behind it from scrolling. */

/* ---------- phone back button ----------
 * Android's back button (and back gestures) walks browser history. The app keeps
 * up to two history entries of its own: one while you're on a tab other than Home,
 * one more while a popup is open. So back closes the popup, then returns to Home,
 * and only leaves the app from Home. */
var popupOpen = false, backTimer = null, backWaiting = false;
function backWanted() { return (D && view !== 'home' ? 1 : 0) + (popupOpen ? 1 : 0); }

 * "close popup then switch tab" in one tap settles to one history change. */
// The app sets its own scroll spot on every tab change; don't let back/forward put an old one back afterwards.
try { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; } catch (e) {}
function syncBack() {
  if (!window.history || !history.pushState) return;
  clearTimeout(backTimer);
  backTimer = setTimeout(function () {
    if (backWaiting) return; // a history.go is still landing; popstate runs us again
    var want = backWanted(), have = backHave();
    if (want > have) { for (var i = have + 1; i <= want; i++) history.pushState({ adLvl: i }, ''); }
    else if (want < have) { backWaiting = true; history.go(want - have); }
  }, 0);
}
window.addEventListener('popstate', function () {
  if (backWaiting) { backWaiting = false; syncBack(); return; } // our own cleanup, not the user
  if (popupOpen) closeAlbum();
  else if (D && view !== 'home') show('home');
  syncBack();
});


/* ---------- motion helpers ---------- */

function calm() { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
/* A number that counts up when it first appears. */
function cnt(v) { return '<span class="cnt" data-v="' + v + '">' + fmt(v) + '</span>'; }
function runCounts(root) {
  if (calm()) return;
  Array.prototype.forEach.call(root.querySelectorAll('.cnt'), function (el, i) {
    var v = Number(el.dataset.v); if (isNaN(v)) return;
    var start = null, delay = 120 + Math.min(i, 14) * 45, dur = 750;
    el.textContent = (0).toFixed(2);
    requestAnimationFrame(function f(t) {
      if (start === null) start = t + delay;
      var p = Math.min(1, Math.max(0, (t - start) / dur)), e = 1 - Math.pow(1 - p, 3);
      el.textContent = (v * e).toFixed(2);
      if (p < 1) requestAnimationFrame(f);
    });
  });
}

/* Slides the gold underline to the current tab. */
var inkReady = false;
function moveInk() {
  var nav = document.getElementById('nav'), ink = document.getElementById('ink'), b = nav && nav.querySelector('button.on');
  if (!ink || !b || !b.offsetWidth) return;
  if (!inkReady) ink.classList.remove('ready');
  ink.style.width = b.offsetWidth + 'px';
  ink.style.transform = 'translateX(' + b.offsetLeft + 'px)';
  if (!inkReady) { void ink.offsetWidth; ink.classList.add('ready'); inkReady = true; }
  if (nav.scrollWidth > nav.clientWidth) {
    var left = b.offsetLeft - (nav.clientWidth - b.offsetWidth) / 2;

/* Album color glow: reads the main color of a tiny copy of the cover art. Falls back to the picker's color. */
var ART = null;
function hexRgb(h) { h = String(h || '').replace('#', ''); if (h.length !== 6) return '108 92 157'; return [0, 2, 4].map(function (i) { return parseInt(h.substr(i, 2), 16); }).join(' '); }
function pickColor(d) {
  var r = 0, g = 0, b = 0, w = 0, ar = 0, ag = 0, ab = 0, n = 0;
  for (var i = 0; i < d.length; i += 4) {
    var R = d[i], G = d[i + 1], B = d[i + 2];

    var sat = mx === mn ? 0 : (mx - mn) / (255 - Math.abs(mx + mn - 255));
    var wt = sat * sat * Math.max(0, 1 - Math.abs(l - .5) * 1.6);
    r += R * wt; g += G * wt; b += B * wt; w += wt;
  }
  var c = w > n * .02 ? [r / w, g / w, b / w] : [ar / n, ag / n, ab / n];
  var luma = .299 * c[0] + .587 * c[1] + .114 * c[2];
  if (luma < 70) c = c.map(function (x) { return x + (255 - x) * .3; }); // lift very dark covers so the glow shows
  return c.map(function (x) { return Math.round(x); }).join(' ');
}
function artColor(a, cb) {
  if (!ART) { try { ART = JSON.parse(storeGet('ad.artColors') || '{}'); } catch (e) { ART = {}; } }
  var fallback = hexRgb(color(a.pickedBy, true));
  if (!a.cover) { cb(fallback); return; }
  if (ART[a.cover]) { cb(ART[a.cover]); return; }
  var small = a.cover.replace(/\/\d+x\d+[a-z-]*\.(jpg|jpeg|png|webp)$/i, '/40x40bb.jpg');
  var im = new Image();
  im.crossOrigin = 'anonymous';
  im.onload = function () {
    try {
      var c = document.createElement('canvas'); c.width = c.height = 24;

}
function albumGlow(a) {

/* Confetti burst, from an element if given, otherwise from the middle of the screen. */

      r: Math.random() * 6 + 5, a: Math.random() * 6.28, va: (Math.random() - .5) * .35, c: cols[i % cols.length], round: Math.random() < .3 });

/* POST with a plain text body: no preflight, which Apps Script can't answer. */
function api(action, args) {

    method: 'POST',

    body: JSON.stringify({ action: action, args: args || [], session: storeGet('ad.session') || '' })
  }).then(function (r) {
    if (!r.ok) throw new Error('The sheet didn\'t answer (' + r.status + '). Try again in a moment.');
    return r.json();
  }, function () {
    throw new Error(navigator.onLine === false ? 'You\'re offline. Showing what was saved on this phone.' : 'Couldn\'t reach the sheet. Check your connection and try again.');
  }).then(function (j) {

  }
  if (signState.err) h += '<div class="msg err">' + esc(signState.err) + '</div>';
  document.getElementById('app').innerHTML = h + '</div>';
  var c = document.getElementById('code'); if (c && !signState.busy) c.focus();
}

function loadMembers() {
  var note = signState.err; signState.err = ''; renderSignIn();
  api('members').then(function (list) { signState.members = list; signState.err = note; renderSignIn(); },
    function (e) { signState.err = e.message; renderSignIn(); });
}
function sendCode(name) {
  signState.busy = name; signState.err = ''; renderSignIn();
  api('requestCode', [name]).then(function (r) {
    signState.busy = false; signState.name = name; signState.hint = r.hint; renderSignIn();
  }, function (e) { signState.busy = false; signState.err = e.message; renderSignIn(); });
}
function checkCode() {
  var el = document.getElementById('code');
  var code = (el ? el.value : '').replace(/\D/g, '');
  if (signState.busy) return;
  signState.code = code;
  if (code.length !== 6) { signState.err = 'The code is 6 digits.'; renderSignIn(); return; }
  signState.busy = true; signState.err = ''; renderSignIn();
  api('verifyCode', [signState.name, code]).then(function (r) {
    storeSet('ad.session', r.session);
    signState = { members: null, name: null, hint: '', busy: false, err: '' };
    start();
  }, function (e) { signState.busy = false; signState.code = ''; signState.err = e.message; renderSignIn(); });
}
/* First open of the home screen app: trade the key from the link for a sign in (see the top of the page). */
function useAppKey() {
  var key = AD_START_KEY; AD_START_KEY = '';
  chrome(false);
  document.getElementById('app').innerHTML = '<div class="card signin"><img class="logo" src="icons/icon-192.png" alt=""><div class="eyebrow">Club Music</div><h2>Signing you in…</h2><div class="muted">Using your sign in from Safari.</div></div>';
  api('useAppKey', [key]).then(function (r) {
    storeSet('ad.session', r.session);
    adCleanUrl('');
    start();
  }, function (e) {
    adCleanUrl('');
    signState.err = /home screen link/.test(e.message) ? e.message : '';
    loadMembers();
  });
}
/* In Safari on an iPhone: keep a fresh app key ready so adding to the home screen keeps you signed in. */
function ensureAppKey() {
  if (!AD_IOS || adStandalone()) return;
  var saved = null; try { saved = JSON.parse(storeGet('ad.appKey') || 'null'); } catch (e) {}
  if (saved && Date.now() - saved.at < 7 * 864e5) { adApplyAppKey(); return; }
  api('appKey').then(function (r) {
    storeSet('ad.appKey', JSON.stringify({ k: r.key, at: Date.now() }));
    adApplyAppKey();
  }, function () {});
}
function signedOut() {
  storeDel('ad.appKey'); adApplyAppKey();
  storeDel('ad.session'); storeDel('ad.data'); storeDel('ad.platform'); storeDel('ad.platformSync');
  D = null; closeAlbum(); syncBack();
  signState = { members: null, name: null, hint: '', busy: false, err: '' };
  loadMembers();
}
function signOut() {
  api('signOut').then(signedOut, signedOut);
}

/* ---------- install tip ---------- */

var deferredInstall = null;
window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferredInstall = e; if (D && view === 'home') show('home'); });
function standalone() { return adStandalone(); }
function installCard() {
  if (standalone() || storeGet('ad.installHidden')) return '';
  var ios = AD_IOS;
  if (!ios && !deferredInstall) return '';
  return '<div class="card install"><img src="icons/icon-192.png" alt=""><div><div class="t1">Put Club Music on your home screen</div>' +
    '<div class="t2">' + (ios ? 'In Safari, tap the Share button, then <b>Add to Home Screen</b>. You\'ll stay signed in, no new code.' : 'Opens full screen like any other app. You\'ll stay signed in.') + '</div>' +
    (ios ? '' : '<button class="btn gold" style="margin-top:8px" onclick="installApp()">Install</button>') +
    '</div><button class="x" onclick="hideInstall()" aria-label="Hide">×</button></div>';
}
function installApp() { if (!deferredInstall) return; deferredInstall.prompt(); deferredInstall.userChoice.then(function () { deferredInstall = null; show(view); }); }
function hideInstall() { storeSet('ad.installHidden', '1'); show(view); }

/* ---------- start up ---------- */

function localToday() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function safeToRedraw() { return !document.getElementById('scrim').classList.contains('on') && ['home', 'albums', 'members', 'stats'].indexOf(view) >= 0; }

/* Fresh numbers from the sheet. Redraws only pages where nobody is typing. */
function refresh(first) {
  var badge = document.getElementById('syncing');
  badge.classList.add('on');
  api('getData').then(function (data) {
    if (savesPending) return; // a rating is still saving; its answer brings fresher numbers
    badge.classList.remove('on');
    prep(data);
    if (first || safeToRedraw()) show(view);
  }, function (e) {
    badge.classList.remove('on');
    if (!storeGet('ad.session')) return; // signed out: sign in screen is up
    if (!D) document.getElementById('app').innerHTML = '<div class="card">' + esc(e.message) + '<div class="actions"><button class="btn primary" onclick="refresh(true)">Try again</button></div></div>';
    else toast(e.message);
  });
}

/* Eye and mouth spots on each club photo (0 to 100), found by the deploy job with
   MediaPipe. Used to place face filters; missing members use default spots. */
function loadFaces() {
  try { FACES = JSON.parse(storeGet('ad.faces') || '{}'); } catch (e) { FACES = {}; }
  api('faces').then(function (map) {
    var text = JSON.stringify(map || {});
    if (text === storeGet('ad.faces')) return;
    storeSet('ad.faces', text); FACES = map || {};
    if (D && view === 'stats' && safeToRedraw()) show(view);
  }, function () {});
}
function loadAvatars() {
  try { AVATARS = JSON.parse(storeGet('ad.avatars') || '{}'); } catch (e) { AVATARS = {}; }
  api('avatars').then(function (map) {
    var text = JSON.stringify(map || {});
    if (text === storeGet('ad.avatars')) return;
    storeSet('ad.avatars', text); AVATARS = map || {};
    if (D) { prep(D); if (safeToRedraw()) show(view); }
  }, function () {});
}

function start() {
  if (!API_URL) {
    document.getElementById('app').innerHTML = '<div class="card signin"><img class="logo" src="icons/icon-192.png" alt=""><h2>Almost ready</h2><div class="muted">This app isn\'t connected to the sheet yet. Add the Apps Script web app URL to config.js.</div></div>';
    chrome(false);
    return;
  }
  if (!storeGet('ad.session') && AD_START_KEY && adStandalone()) { useAppKey(); return; }
  if (!storeGet('ad.session')) { loadMembers(); return; }
  chrome(true);
  ensureAppKey();
  loadAvatars(); loadFaces();
  var cached = null;
  try { cached = JSON.parse(storeGet('ad.data') || 'null'); } catch (e) {}
  if (cached) { cached.today = localToday(); prep(cached); show('home'); }
  refresh(!cached);
}

/* Coming back to the app after a while: pull fresh numbers. */
var lastHidden = 0;
document.addEventListener('visibilitychange', function () {
  if (document.hidden) { lastHidden = Date.now(); return; }
  if (D && storeGet('ad.session') && Date.now() - lastHidden > 60000) refresh(false);
});

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      // Look for a new version whenever the app comes back to the front (installed apps rarely reload).
      document.addEventListener('visibilitychange', function () { if (!document.hidden) reg.update().catch(function () {}); });
    }).catch(function () {});
  });
}

start();
</script>

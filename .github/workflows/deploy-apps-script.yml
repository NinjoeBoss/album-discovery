# Uploads apps-script/ into the Apps Script project and publishes a new version
# of the "Github" deployment (the app's data link, so its URL never changes).
# Runs on every push to main that changes a file in apps-script/.
#
# Members.gs and Avatars.html are private, so they come from the MEMBERS_GS and
# AVATARS_HTML secrets instead of the public repo. SpotifyKeys.gs is built from
# the optional SPOTIFY_CLIENT_ID and SPOTIFY_CLIENT_SECRET secrets.
#
# Safety: clasp replaces the whole project, so this stops without uploading if
# the live project has a file that isn't in apps-script/ (for example something
# added by hand in the editor). Pull it into the repo first, then push again.
name: Deploy to Apps Script

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps-script/**'
      - '!apps-script/.pull'
      - '!apps-script/FILES.txt'
      - '!apps-script/*.example.gs'

concurrency:
  group: apps-script
  cancel-in-progress: false

env:
  SCRIPT_ID: 1JfGmMbyMc9Gc1eBPo6c4g3_ZmX1ezRNam3AC7O5F5tE-7xuuokXmOYC4
  # The "Github" deployment, the /exec link in config.js
  DEPLOYMENT_ID: AKfycbwJQcPMYR2FfdVh-AwIXo_dT0t_V1PR92nCaxjux-Z2akJMAu0Q1io6CtaSk2xhWr7_

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Sign in with the saved login
        env:
          CLASPRC: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC" ]; then echo "The CLASPRC_JSON secret is missing."; exit 1; fi
          printf '%s' "$CLASPRC" > ~/.clasprc.json

      - name: Put the files together
        env:
          MEMBERS_GS: ${{ secrets.MEMBERS_GS }}
          AVATARS_HTML: ${{ secrets.AVATARS_HTML }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          if [ -z "$MEMBERS_GS" ]; then echo "The MEMBERS_GS secret is missing."; exit 1; fi
          if [ -z "$AVATARS_HTML" ]; then echo "The AVATARS_HTML secret is missing."; exit 1; fi
          mkdir -p /tmp/push
          for f in apps-script/*; do
            [ -f "$f" ] || continue
            case "$(basename "$f")" in
              FILES.txt|*.example.gs|members*|Members*|avatars*|Avatars*|spotifykeys*|SpotifyKeys*|facepoints*|FacePoints*) ;;
              *) cp "$f" /tmp/push/ ;;
            esac
          done
          printf '%s\n' "$MEMBERS_GS" > /tmp/push/Members.gs
          printf '%s\n' "$AVATARS_HTML" > /tmp/push/Avatars.html
          if [ -n "$SPOTIFY_CLIENT_ID" ] && [ -n "$SPOTIFY_CLIENT_SECRET" ]; then
            id=$(printf '%s' "$SPOTIFY_CLIENT_ID" | tr -d '[:space:]"\\')
            sec=$(printf '%s' "$SPOTIFY_CLIENT_SECRET" | tr -d '[:space:]"\\')
            printf '// Private: written by the deploy job from GitHub secrets. Not in the repo.\nvar AD_SPOTIFY_KEYS = { id: "%s", secret: "%s" };\n' "$id" "$sec" > /tmp/push/SpotifyKeys.gs
            echo "Spotify keys: added from secrets"
          else
            echo "Spotify keys: no SPOTIFY_CLIENT_ID / SPOTIFY_CLIENT_SECRET secrets, skipping"
          fi
          grep -q 'AD_MEMBER_EMAILS' /tmp/push/Members.gs || { echo "MEMBERS_GS doesn't look like Members.gs (no AD_MEMBER_EMAILS)."; exit 1; }
          grep -q 'AVATARS' /tmp/push/Avatars.html || { echo "AVATARS_HTML doesn't look like the Avatars file (no AVATARS)."; exit 1; }
          echo "Uploading:"; ls -1 /tmp/push

      # Face points: finds each member's eyes and mouth on their club photo so the
      # app can draw filters (the Procrastinator's tears) in the right spot. Only the
      # positions go into FacePoints.gs; the photos stay private. If anything here
      # fails, an empty FacePoints.gs is uploaded and the app uses its default spots.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Find faces in the club photos
        run: |
          set +e
          ok=0
          # MediaPipe's native library needs the EGL / GLES libraries, which the runner doesn't have
          sudo apt-get install -y -qq libegl1 libgles2 > /dev/null \
            && pip install -q mediapipe==1.2.2 pillow numpy \
            && curl -sSfL --max-time 120 -o /tmp/face_landmarker.task \
              https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task \
            && python .github/scripts/face_points.py /tmp/push/Avatars.html /tmp/face_landmarker.task /tmp/push/FacePoints.gs \
            && ok=1
          if [ "$ok" != 1 ] || ! grep -q 'AD_FACE_POINTS' /tmp/push/FacePoints.gs; then
            echo "::warning title=Face points::Face detection didn't run; uploading empty face points (app uses default spots)."
            printf '/** Written by the deploy job. Face detection did not run this time. */\nvar AD_FACE_POINTS = {};\n' > /tmp/push/FacePoints.gs
          fi
          cat /tmp/push/FacePoints.gs | tail -1 | cut -c1-400

      - name: Check nothing in the live project would be lost
        run: |
          mkdir -p /tmp/live && cd /tmp/live
          printf '{"scriptId":"%s","rootDir":".","fileExtension":"gs","scriptExtensions":[".gs"],"htmlExtensions":[".html"],"jsonExtensions":[".json"]}' "$SCRIPT_ID" > .clasp.json
          clasp pull > /dev/null
          missing=""
          for f in *; do
            case "$f" in SpotifyKeys*) continue ;; esac
            [ -e "/tmp/push/$f" ] || missing="$missing\n  $f"
          done
          if [ -n "$missing" ]; then
            printf "These files are in Apps Script but not in the repo, so nothing was uploaded:$missing\n"
            echo "Run the 'Pull from Apps Script' job first so the repo has them."
            exit 1
          fi
          echo "Files that will change:"
          for f in *; do cmp -s "$f" "/tmp/push/$f" || echo "  $f"; done
          for f in /tmp/push/*; do [ -e "$(basename "$f")" ] || echo "  $(basename "$f") (new)"; done

      - name: Upload
        run: |
          cd /tmp/push
          printf '{"scriptId":"%s","rootDir":".","fileExtension":"gs","scriptExtensions":[".gs"],"htmlExtensions":[".html"],"jsonExtensions":[".json"]}' "$SCRIPT_ID" > .clasp.json
          clasp push --force

      - name: Publish a new version of the Github deployment
        run: |
          cd /tmp/push
          desc="$(git -C "$GITHUB_WORKSPACE" log -1 --format=%s | cut -c1-90)"
          clasp create-deployment --deploymentId "$DEPLOYMENT_ID" --description "$desc" \
            || clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "$desc"
          clasp list-deployments 2>/dev/null | grep "$DEPLOYMENT_ID" || clasp deployments | grep "$DEPLOYMENT_ID"

      - name: Check the Spotify link lookup
        run: |
          sleep 5
          probe=""
          if [ -s apps-script/.spotify-probe ]; then
            probe="&$(head -1 apps-script/.spotify-probe)"
          fi
          status=$(curl -sSL --max-time 90 "https://script.google.com/macros/s/$DEPLOYMENT_ID/exec?check=spotify$probe" | head -c 3000 | tr '\n\r' '  ')
          echo "$status"
          case "$status" in
            "Spotify: working"*) echo "::notice title=Spotify check::$status" ;;
            "Spotify: keys not set"*) echo "::warning title=Spotify check::$status" ;;
            *) echo "::error title=Spotify check::$status"; exit 1 ;;
          esac
          # Cover check: one annotation per album, then test that each cover URL really loads.
          curl -sSL --max-time 120 "https://script.google.com/macros/s/$DEPLOYMENT_ID/exec?check=covers" > covers.txt || true
          while IFS= read -r line; do
            url=$(echo "$line" | awk -F' [|] ' '{ if ($3 != "-") print $3; else print $4 }')
            code="-"
            case "$url" in https://*) code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url") ;; esac
            echo "::notice title=Cover::$line | http $code"
          done < covers.txt

      # Explicit check: which album links are the clean (censored) copy. Lines marked
      # (sheet) are links typed into the sheet; those have to be changed there.
      - name: Check album links are the explicit versions
        run: |
          curl -sSL --max-time 300 "https://script.google.com/macros/s/$DEPLOYMENT_ID/exec?check=explicit" > explicit.txt || true
          while IFS= read -r line; do
            case "$line" in
              *"apple: clean"*|*"spotify: explicit"*"(sheet) -> "*) echo "::warning title=Clean link in sheet::$line" ;;
              *) echo "::notice title=Explicit::$line" ;;
            esac
          done < explicit.txt
